<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#08080d" rx="200" />
  <circle cx="500" cy="500" r="420" fill="#0f0f18" stroke="#1a1a2e" stroke-width="12" />
  <circle cx="500" cy="500" r="380" fill="none" stroke="#00FF88" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 12" />
  <!-- Centered Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#glow)" />
</svg>
