<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#08080d" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#0f0f18" stroke="#1a1a2e" stroke-width="4" />
  <!-- Circuit AI Lines -->
  <path d="M 100 256 L 220 256 M 290 256 L 412 256 M 256 100 L 256 180 M 256 330 L 256 412" stroke="#00FF8822" stroke-width="3" stroke-dasharray="6,6" />
  <circle cx="100" cy="256" r="6" fill="#00FF8866" />
  <circle cx="412" cy="256" r="6" fill="#00AAFF66" />
  <circle cx="256" cy="100" r="6" fill="#00FF8866" />
  <circle cx="256" cy="412" r="6" fill="#00AAFF66" />
  <!-- Lightning Bolt Symbol -->
  <path d="M 290 96 L 170 272 L 250 272 L 200 416 L 330 240 L 250 240 Z" fill="url(#boltGradient)" filter="url(#glow)" />
</svg>
