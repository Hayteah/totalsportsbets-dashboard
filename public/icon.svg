<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF8825" />
      <stop offset="60%" stop-color="#00AAFF10" />
      <stop offset="100%" stop-color="#08080D00" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="#08080D" />
  <circle cx="500" cy="500" r="460" fill="url(#bgGlow)" />

  <!-- Tech Grid Overlay -->
  <circle cx="500" cy="500" r="420" fill="none" stroke="#1A1A2E" stroke-width="8" />
  <circle cx="500" cy="500" r="320" fill="none" stroke="#00FF8820" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Target Reticle Overlay -->
  <line x1="500" y1="80" x2="500" y2="180" stroke="#00FF88" stroke-width="6" stroke-linecap="round" />
  <line x1="500" y1="820" x2="500" y2="920" stroke="#00FF88" stroke-width="6" stroke-linecap="round" />
  <line x1="80" y1="500" x2="180" y2="500" stroke="#00FF88" stroke-width="6" stroke-linecap="round" />
  <line x1="820" y1="500" x2="920" y2="500" stroke="#00FF88" stroke-width="6" stroke-linecap="round" />

  <!-- Central Emblem Container -->
  <rect x="220" y="220" width="560" height="560" rx="140" fill="#0F0F18" stroke="#00FF8850" stroke-width="8" filter="url(#glow)" />

  <!-- Lightning Bolt Path -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
