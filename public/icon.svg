<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#08080d" stroke="#00FF88" stroke-opacity="0.3" stroke-width="4"/>
  <rect x="32" y="32" width="448" height="448" rx="94" fill="#0f0f18" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#boltGrad)" stroke-width="6" stroke-opacity="0.25" />

  <!-- Lightning Bolt -->
  <path d="M 290 80 L 170 270 L 260 270 L 210 432 L 340 240 L 250 240 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
