<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#08080d" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#boltGradient)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Glow Bolt -->
  <path d="M296 48 L144 272 H256 L216 464 L368 240 H256 Z" fill="url(#boltGradient)" opacity="0.3" filter="url(#glow)" />

  <!-- Main Sharp Lightning Bolt -->
  <path d="M296 48 L144 272 H256 L216 464 L368 240 H256 Z" fill="url(#boltGradient)" />
</svg>
