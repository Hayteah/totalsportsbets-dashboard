<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c14" />
      <stop offset="100%" stop-color="#08080d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)" />
  <rect x="8" y="8" width="496" height="496" rx="102" stroke="url(#boltGradient)" stroke-opacity="0.3" stroke-width="4" />
  <!-- Background Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="#00FF88" fill-opacity="0.05" filter="url(#glow)" />
  <!-- Lightning Bolt Symbol -->
  <path d="M 295 100 L 180 270 L 265 270 L 215 412 L 330 240 L 245 240 Z" fill="url(#boltGradient)" filter="url(#glow)" />
</svg>
