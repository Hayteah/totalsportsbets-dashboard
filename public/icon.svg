<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#08080d" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#00FF88" stroke-opacity="0.25" stroke-width="2" />

  <!-- Background Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#00FF88" opacity="0.12" filter="url(#glow)" />

  <!-- Lightning Bolt Icon scaled & centered -->
  <g transform="translate(256, 256) scale(0.48) translate(-500, -500)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  </g>
</svg>
