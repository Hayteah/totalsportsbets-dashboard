<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00AAFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0c0c14" />

  <!-- Subtle Outer Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />

  <!-- Outer Border Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#iconGradient)" stroke-width="8" opacity="0.8" />
  <circle cx="256" cy="256" r="195" fill="#12121e" stroke="#1a1a2e" stroke-width="4" />

  <!-- Lightning Bolt Icon -->
  <path d="M 285 100 L 180 260 L 260 260 L 210 410 L 330 230 L 250 230 Z" fill="url(#iconGradient)" />
</svg>