<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#08080d"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#iconBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#boltGrad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Outer Glow Bolt -->
  <path d="M 290 80 L 170 260 L 250 260 L 200 420 L 330 230 L 250 230 Z" fill="url(#boltGrad)" filter="url(#glow)" opacity="0.6"/>

  <!-- Sharp Main Bolt -->
  <path d="M 290 80 L 170 260 L 250 260 L 200 420 L 330 230 L 250 230 Z" fill="url(#boltGrad)"/>
</svg>
