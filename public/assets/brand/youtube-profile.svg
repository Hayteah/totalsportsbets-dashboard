<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="yt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="60%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="yt-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <linearGradient id="yt-bolt" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <radialGradient id="yt-glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#00AAFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00FF88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#08080d" stop-opacity="0"/>
    </radialGradient>
    <filter id="yt-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- YouTube Circular Crop Base -->
  <rect width="800" height="800" fill="url(#yt-bg)"/>
  <circle cx="400" cy="400" r="380" fill="url(#yt-glow)"/>

  <!-- High-tech radar / sports lines -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="400" cy="400" r="340" fill="none" stroke="url(#yt-neon)" stroke-width="3" stroke-dasharray="16 12" opacity="0.65"/>
  <circle cx="400" cy="400" r="300" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>

  <!-- Center Card Emblem -->
  <rect x="250" y="190" width="300" height="300" rx="65" fill="#0f0f18" stroke="url(#yt-neon)" stroke-width="5"/>
  <rect x="262" y="202" width="276" height="276" rx="55" fill="none" stroke="#1a1a2e" stroke-width="2"/>

  <!-- Lightning Bolt -->
  <path d="M425 225 L320 355 L395 355 L350 455 L480 325 L405 325 Z"
        fill="url(#yt-bolt)"
        filter="url(#yt-blur)"/>

  <!-- Label text -->
  <text x="400" y="565"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="40"
        font-weight="900"
        letter-spacing="4"
        fill="#FFFFFF">
    TOTALSPORT<tspan fill="#00FF88">BET</tspan>
  </text>
  <text x="400" y="610"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="16"
        font-weight="700"
        letter-spacing="5"
        fill="#00AAFF">
    AI SPORTS PREDICTIONS
  </text>

  <!-- Accuracy pill -->
  <rect x="310" y="640" width="180" height="32" rx="16" fill="#00FF8818" stroke="#00FF8840" stroke-width="1.5"/>
  <text x="400" y="662"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="700"
        fill="#00FF88">
    84.2% WIN RATE
  </text>
</svg>
