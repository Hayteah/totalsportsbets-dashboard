<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="40%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <radialGradient id="top-glow" cx="50%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#08080d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bot-glow" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#00AAFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#08080d" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1350" fill="url(#card-bg)"/>
  <circle cx="540" cy="150" r="600" fill="url(#top-glow)"/>
  <circle cx="540" cy="1200" r="700" fill="url(#bot-glow)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1350"/>
    <line x1="1000" y1="0" x2="1000" y2="1350"/>
    <line x1="0" y1="180" x2="1080" y2="180"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
  </g>

  <!-- HEADER BRANDING -->
  <g transform="translate(80, 80)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#accent-grad)"/>
    <text x="35" y="47" text-anchor="middle" font-size="34" font-weight="900" fill="#08080d">⚡</text>

    <!-- Wordmark -->
    <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#FFFFFF">
      TOTALSPORT<tspan fill="#00FF88">BET</tspan>
    </text>
    <text x="92" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#8b8ba0">
      AI SPORTS PREDICTIONS
    </text>

    <!-- Date/League Pill -->
    <rect x="700" y="14" width="220" height="42" rx="21" fill="#12121e" stroke="#1a1a2e" stroke-width="2"/>
    <text x="810" y="41" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#00AAFF">
      TODAY'S PICKS ⚽
    </text>
  </g>

  <!-- TOP MATCH CARD -->
  <g transform="translate(80, 200)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="920" height="420" rx="24" fill="#0f0f18" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Neon Top Accent Line -->
    <path d="M 0 24 Q 0 0 24 0 L 896 0 Q 920 0 920 24" fill="none" stroke="url(#accent-grad)" stroke-width="5"/>

    <!-- Match Metadata Header -->
    <g transform="translate(40, 40)">
      <text font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#8b8ba0" letter-spacing="2">
        PREMIER LEAGUE · 21:00 CET
      </text>
      <!-- Confidence Badge -->
      <rect x="680" y="-14" width="160" height="38" rx="19" fill="#00FF8818" stroke="#00FF8840" stroke-width="1.5"/>
      <text x="760" y="11" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#00FF88">
        HIGH 84% CONF
      </text>
    </g>

    <!-- Fixture Teams -->
    <g transform="translate(40, 140)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">
        ARSENAL <tspan fill="#4a4a5e">vs</tspan> CHELSEA
      </text>
    </g>

    <!-- Highlighted Pick Box -->
    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="840" height="150" rx="18" fill="#12121e" stroke="#1a1a2e" stroke-width="2"/>

      <text x="36" y="50" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#8b8ba0">
        SELECTED PREDICTION
      </text>
      <text x="36" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
        ARSENAL TO WIN &amp; OVER 1.5
      </text>

      <!-- Odds & Value Pill -->
      <g transform="translate(620, 35)">
        <text x="0" y="55" font-family="monospace" font-size="48" font-weight="900" fill="#00FF88">
          @1.85
        </text>
        <rect x="130" y="20" width="80" height="38" rx="8" fill="#00FF8818" stroke="#00FF8840"/>
        <text x="170" y="45" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#00FF88">
          +12%
        </text>
      </g>
    </g>
  </g>

  <!-- SECONDARY MATCH CARD -->
  <g transform="translate(80, 660)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="920" height="420" rx="24" fill="#0f0f18" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M 0 24 Q 0 0 24 0 L 896 0 Q 920 0 920 24" fill="none" stroke="url(#accent-grad)" stroke-width="5"/>

    <!-- Match Metadata Header -->
    <g transform="translate(40, 40)">
      <text font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#8b8ba0" letter-spacing="2">
        LA LIGA · 21:30 CET
      </text>
      <!-- Confidence Badge -->
      <rect x="680" y="-14" width="160" height="38" rx="19" fill="#00FF8818" stroke="#00FF8840" stroke-width="1.5"/>
      <text x="760" y="11" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#00FF88">
        HIGH 78% CONF
      </text>
    </g>

    <!-- Fixture Teams -->
    <g transform="translate(40, 140)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">
        REAL MADRID <tspan fill="#4a4a5e">vs</tspan> BARCELONA
      </text>
    </g>

    <!-- Highlighted Pick Box -->
    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="840" height="150" rx="18" fill="#12121e" stroke="#1a1a2e" stroke-width="2"/>

      <text x="36" y="50" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#8b8ba0">
        SELECTED PREDICTION
      </text>
      <text x="36" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
        BOTH TEAMS TO SCORE (YES)
      </text>

      <!-- Odds & Value Pill -->
      <g transform="translate(620, 35)">
        <text x="0" y="55" font-family="monospace" font-size="48" font-weight="900" fill="#00FF88">
          @1.72
        </text>
        <rect x="130" y="20" width="80" height="38" rx="8" fill="#00FF8818" stroke="#00FF8840"/>
        <text x="170" y="45" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#00FF88">
          +9.5%
        </text>
      </g>
    </g>
  </g>

  <!-- FOOTER / CALL TO ACTION -->
  <g transform="translate(80, 1120)">
    <rect x="0" y="0" width="920" height="130" rx="20" fill="#12121e" stroke="#1a1a2e" stroke-width="2"/>

    <!-- Footer CTA text -->
    <text x="40" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">
      GET FULL AI PREDICTIONS &amp; ACCA
    </text>
    <text x="40" y="90" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#00AAFF">
      Join free VIP telegram · Link in bio · @totalsportbet
    </text>

    <!-- Staking & ROI indicator -->
    <g transform="translate(710, 40)">
      <rect x="0" y="0" width="170" height="50" rx="12" fill="url(#accent-grad)"/>
      <text x="85" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#08080d">
        18.4% ROI ⚡
      </text>
    </g>
  </g>
</svg>
