<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="home-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#0f0f18"/>
    </linearGradient>
    <linearGradient id="brand-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <linearGradient id="bolt-solid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00FF88" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect width="512" height="512" rx="115" fill="url(#home-grad)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#brand-neon)" stroke-width="6"/>

  <!-- Inner border glow -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="#0f0f18" stroke="#1a1a2e" stroke-width="2"/>

  <!-- Corner Tech Accent Dots -->
  <circle cx="60" cy="60" r="5" fill="#00FF88"/>
  <circle cx="452" cy="60" r="5" fill="#00AAFF"/>
  <circle cx="60" cy="452" r="5" fill="#00AAFF"/>
  <circle cx="452" cy="452" r="5" fill="#00FF88"/>

  <!-- Iconic Lightning Bolt - Exact Dashboard Style -->
  <path d="M280 85 L145 260 L240 260 L180 425 L365 220 L270 220 Z"
        fill="url(#bolt-solid)"
        filter="url(#shadow-glow)"/>

  <!-- Subtitle indicator badge -->
  <rect x="156" y="420" width="200" height="34" rx="17" fill="#12121e" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="256" y="442"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="14"
        font-weight="800"
        letter-spacing="3"
        fill="#00FF88">
    TOTALSPORT
  </text>
</svg>
