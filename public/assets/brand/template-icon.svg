<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tmpl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#0f0f18"/>
    </linearGradient>
    <linearGradient id="tmpl-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#tmpl-bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Stack of Cards Icon Representation -->
  <!-- Background Card -->
  <rect x="156" y="90" width="220" height="280" rx="18" fill="#12121e" stroke="#1a1a2e" stroke-width="2" transform="rotate(8 266 230)" opacity="0.6"/>
  <!-- Middle Card -->
  <rect x="136" y="90" width="220" height="280" rx="18" fill="#12121e" stroke="#00AAFF" stroke-width="2" stroke-opacity="0.4" transform="rotate(-5 246 230)" opacity="0.8"/>
  <!-- Front Card -->
  <g transform="translate(146, 100)">
    <rect x="0" y="0" width="220" height="280" rx="18" fill="#0f0f18" stroke="url(#tmpl-neon)" stroke-width="3"/>

    <!-- Match Header Simulation inside Card -->
    <rect x="18" y="24" width="70" height="12" rx="6" fill="#00FF88" fill-opacity="0.2"/>
    <text x="24" y="33" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#00FF88">HIGH 88%</text>

    <!-- Fixture title lines -->
    <rect x="18" y="50" width="140" height="10" rx="4" fill="#e2e2e8"/>
    <rect x="18" y="66" width="90" height="8" rx="4" fill="#4a4a5e"/>

    <!-- Prediction Value Banner -->
    <rect x="18" y="95" width="184" height="60" rx="10" fill="#12121e" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="32" y="120" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#8b8ba0">OVER 2.5 GOALS</text>
    <text x="32" y="142" font-family="monospace" font-size="16" font-weight="900" fill="#00FF88">@1.95</text>
    <rect x="130" y="112" width="60" height="26" rx="6" fill="#00FF8818" stroke="#00FF8840"/>
    <text x="160" y="129" text-anchor="middle" font-family="monospace" font-size="10" font-weight="800" fill="#00FF88">+14.2%</text>

    <!-- Bolt Icon in bottom corner -->
    <path d="M175 190 L150 225 L168 225 L158 255 L190 215 L172 215 Z" fill="url(#tmpl-neon)"/>
  </g>

  <!-- Template Label -->
  <text x="256" y="445"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22"
        font-weight="900"
        letter-spacing="3"
        fill="#FFFFFF">
    TEMPLATE<tspan fill="#00FF88"> MAKER</tspan>
  </text>
  <text x="256" y="475"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="4"
        fill="#00AAFF">
    AI GRAPHIC ENGINE
  </text>
</svg>
