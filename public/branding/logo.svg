<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="950" height="240">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background container -->
  <rect width="950" height="240" rx="30" fill="#08080d" stroke="#1a1a2e" stroke-width="4" />
  <!-- Logo Icon Container -->
  <rect x="30" y="30" width="180" height="180" rx="36" fill="#0f0f18" stroke="url(#boltGradient)" stroke-width="4" stroke-opacity="0.4" />
  <!-- Lightning Bolt Symbol -->
  <path d="M 140 50 L 70 125 L 115 125 L 85 190 L 160 110 L 115 110 Z" fill="url(#boltGradient)" filter="url(#glow)" />
  <!-- Text Label -->
  <text x="240" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="4">TOTALSPORTBET</text>
  <text x="245" y="180" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" letter-spacing="8">AI DASHBOARD</text>
</svg>
