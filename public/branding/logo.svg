<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10) scale(0.42)">
    <rect width="512" height="512" rx="110" fill="#0c0c14" />
    <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#boltGradient)" stroke-opacity="0.3" stroke-width="8" />
    <path d="M 296 102 L 184 266 L 266 266 L 215 410 L 328 246 L 246 246 Z" fill="url(#boltGradient)" filter="url(#glow)" />
  </g>

  <!-- Typography: TOTALSPORTBET -->
  <text x="250" y="145" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="3">
    TOTALSPORTBET
  </text>
  <text x="252" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="url(#boltGradient)" letter-spacing="12">
    AI DASHBOARD
  </text>
</svg>
