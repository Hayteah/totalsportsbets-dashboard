<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="#0f0f1c" stroke="url(#boltGrad)" stroke-width="4" />

  <!-- Icon Lightning Bolt -->
  <g filter="url(#neonGlow)">
    <path d="M 135 45 L 75 130 L 115 130 L 90 195 L 155 115 L 115 115 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Logo Brand Text -->
  <text x="250" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="3">TOTALSPORTBET</text>
  <text x="255" y="175" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" letter-spacing="10">AI DASHBOARD</text>
</svg>
