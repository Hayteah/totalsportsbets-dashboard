<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E2E8" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Icon Box -->
    <rect width="220" height="220" rx="44" fill="#0f0f18" stroke="#00FF88" stroke-opacity="0.25" stroke-width="4" />
    <path d="M 130 35 L 75 115 L 115 115 L 90 185 L 145 105 L 105 105 Z" fill="url(#logoBoltGrad)" filter="url(#logoGlow)" />

    <!-- Text Section -->
    <text x="255" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="url(#logoTextGrad)" letter-spacing="3">TOTALSPORTBET</text>
    <text x="258" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#00FF88" letter-spacing="10" opacity="0.9">AI PREDICTION DASHBOARD</text>
  </g>
</svg>
