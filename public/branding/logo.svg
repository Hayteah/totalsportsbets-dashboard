<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#00AAFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Ambient Glow & Subtle Grid/Ring -->
  <circle cx="500" cy="500" r="460" fill="url(#bgGlow)" />
  <circle cx="500" cy="500" r="440" fill="none" stroke="#1a1a2e" stroke-width="4" stroke-dasharray="8 12" opacity="0.6" />
  <circle cx="500" cy="500" r="390" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.25" />

  <!-- Central Brand Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#neonGlow)" />
</svg>
