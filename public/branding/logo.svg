<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="950" height="240">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Bolt Icon Box -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="#0f0f18" stroke="#1a1a2e" stroke-width="4" />
  <path d="M 130 50 L 80 120 L 120 120 L 90 190 L 150 110 L 110 110 Z" fill="url(#boltGradient)" filter="url(#glow)" />

  <!-- Text Brand -->
  <text x="250" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#e2e2e8" letter-spacing="2">TOTALSPORTBET</text>
  <text x="254" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="38" fill="url(#boltGradient)" letter-spacing="10">AI DASHBOARD</text>
</svg>
