<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Logo Icon Container Box -->
  <rect x="20" y="20" width="200" height="200" rx="40" fill="url(#boltGradient)" />
  <rect x="24" y="24" width="192" height="192" rx="36" fill="#08080d" opacity="0.1" />

  <!-- Lightning bolt inside box (scaled down and centered in 200x200 box) -->
  <g transform="translate(20, 20) scale(0.2)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="#FFFFFF" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <text x="260" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="72" letter-spacing="2">TOTALSPORTBET</text>
  <text x="265" y="180" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" letter-spacing="10">AI DASHBOARD</text>
</svg>
