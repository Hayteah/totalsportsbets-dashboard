<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="950" height="240">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="950" height="240" rx="30" fill="#08080d"/>

  <!-- Logo Icon Container -->
  <rect x="30" y="30" width="180" height="180" rx="40" fill="#0f0f18" stroke="url(#boltGradient)" stroke-width="4"/>
  <circle cx="120" cy="120" r="70" fill="none" stroke="#00FF88" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Icon Lightning Bolt -->
  <path d="M 135 60 L 85 130 L 120 130 L 100 180 L 155 110 L 120 110 Z" fill="url(#boltGradient)" filter="url(#glowEffect)"/>

  <!-- Logo Text -->
  <text x="240" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">TOTALSPORTBET</text>
  <text x="240" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#00AAFF" letter-spacing="8">AI PREDICTION DASHBOARD</text>

  <!-- AI Badge -->
  <rect x="790" y="78" width="110" height="52" rx="16" fill="url(#boltGradient)" />
  <text x="845" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#08080d" text-anchor="middle">AI</text>
</svg>
