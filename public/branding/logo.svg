<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00FF88" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="#0f0f18" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Small Lightning Bolt Emblem in Logo Icon Box -->
  <g transform="translate(-100, -80) scale(0.4)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#shadow)"/>
  </g>

  <!-- Text: TOTALSPORTBET -->
  <text x="250" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="2">TOTALSPORTBET</text>

  <!-- Text: AI PREDICTIONS -->
  <text x="252" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="url(#boltGradient)" letter-spacing="6">AI PREDICTIONS</text>
</svg>
