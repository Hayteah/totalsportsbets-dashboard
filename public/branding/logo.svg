<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="950" height="240">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Optional Dark Container -->
  <rect width="950" height="240" rx="32" fill="#08080d" stroke="#1a1a2e" stroke-width="2" />

  <!-- Lightning Icon Container -->
  <rect x="40" y="30" width="180" height="180" rx="36" fill="#12121e" stroke="#00FF8840" stroke-width="3" filter="url(#glow)" />

  <!-- Lightning Bolt -->
  <path d="M 148 55 L 85 135 L 132 135 L 102 195 L 165 115 L 118 115 Z" fill="url(#boltGradient)" />

  <!-- Logo Text Header -->
  <text x="260" y="125" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="4">TOTALSPORTBET</text>

  <!-- Subtitle Text -->
  <text x="260" y="175" font-family="'Inter', 'Arial', sans-serif" font-size="28" font-weight="800" fill="#00FF88" letter-spacing="12">AI DASHBOARD</text>
</svg>
