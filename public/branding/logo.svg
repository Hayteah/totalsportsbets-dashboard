<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#0c0c14" />
  <circle cx="500" cy="500" r="450" fill="url(#bgGlow)" />

  <!-- Outer Ring Accent -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#boltGradient)" stroke-width="8" stroke-opacity="0.4" />
  <circle cx="500" cy="500" r="420" fill="none" stroke="#1a1a2e" stroke-width="4" />

  <!-- Lightning Bolt Icon -->
  <g transform="translate(0, -30)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" />
  </g>

  <!-- Text Branding -->
  <text x="500" y="800" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TOTALSPORTBET</text>
  <text x="500" y="850" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="24" fill="#00FF88" text-anchor="middle" letter-spacing="8">AI PREDICTIONS</text>
</svg>
