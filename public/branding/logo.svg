<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon container -->
  <rect x="10" y="20" width="200" height="200" rx="40" fill="#1a1a2e" stroke="#00FF8830" stroke-width="4" />
  <!-- Scaled bolt inside icon container -->
  <g transform="translate(10, 20) scale(0.2)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  </g>
  <!-- Brand text -->
  <text x="240" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="70" fill="#ffffff" letter-spacing="2">TOTALSPORTBET</text>
  <text x="245" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="30" fill="#00FF88" letter-spacing="8">AI PREDICTIONS</text>
</svg>