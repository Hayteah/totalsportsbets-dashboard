<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="950" height="240" rx="32" fill="#08080d" />
  <!-- Logo Icon -->
  <g transform="translate(20, 20)">
    <rect width="200" height="200" rx="40" fill="#0f0f18" stroke="#1a1a2e" stroke-width="4" />
    <path d="M 120 30 L 60 115 L 105 115 L 75 170 L 140 95 L 95 95 Z" fill="url(#boltGradient)" filter="url(#glow)" />
  </g>
  <!-- Brand Text -->
  <text x="250" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="56" letter-spacing="3">TOTALSPORTBET</text>
  <rect x="250" y="145" width="85" height="32" rx="8" fill="#00FF8818" stroke="#00FF8840" stroke-width="2" />
  <text x="292" y="167" text-anchor="middle" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="18" letter-spacing="2">AI</text>
  <text x="350" y="167" fill="#8B8BA0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="16" letter-spacing="1">PREDICTION PLATFORM</text>
</svg>
