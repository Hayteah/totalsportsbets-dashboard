<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E2E8"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container optional, keeping transparent for flexible headers -->
  <g transform="translate(20, 20)">
    <!-- Hexagonal Crest Shield -->
    <polygon points="100,10 170,50 170,140 100,180 30,140 30,50" fill="#0f0f18" stroke="url(#logoGlowGrad)" stroke-width="4" filter="url(#logoGlow)"/>
    <polygon points="100,18 162,54 162,136 100,172 38,136 38,54" fill="#12121e" stroke="#1a1a2e" stroke-width="2"/>

    <!-- Central AI Lightning Bolt -->
    <path d="M 115 35 L 75 95 L 102 95 L 85 155 L 130 85 L 102 85 Z" fill="url(#logoGlowGrad)"/>

    <!-- Sports Accent Dots -->
    <circle cx="100" cy="25" r="3" fill="#00FF88"/>
    <circle cx="100" cy="165" r="3" fill="#00AAFF"/>

    <!-- Brand Name Text -->
    <text x="200" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="2" fill="url(#textGrad)">TOTALSPORTBET</text>

    <!-- Subtitle Badge -->
    <rect x="202" y="125" width="220" height="32" rx="6" fill="#00FF8818" stroke="#00FF8840" stroke-width="1.5"/>
    <text x="214" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="4" fill="#00FF88">AI PREDICTIONS</text>

    <!-- Live indicator badge -->
    <circle cx="445" cy="141" r="5" fill="#00FF88"/>
    <text x="458" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#8B8BA0">PRO SYSTEM</text>
  </g>
</svg>
