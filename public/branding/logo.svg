<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="950" height="240">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E2E8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="950" height="240" rx="24" fill="#0c0c14"/>

  <!-- Logo Icon Badge -->
  <rect x="20" y="20" width="200" height="200" rx="36" fill="url(#boltGradient)" fill-opacity="0.15" stroke="url(#boltGradient)" stroke-width="3"/>

  <!-- Glowing Aura Circle -->
  <circle cx="120" cy="120" r="70" fill="#00FF88" opacity="0.15" filter="url(#glow)"/>

  <!-- Scaled Lightning Bolt inside badge -->
  <g transform="translate(20, 20) scale(0.2)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="250" y="125" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="64" fill="url(#textGradient)" letter-spacing="2">
    TOTALSPORTBET
  </text>
  <text x="252" y="175" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#00FF88" letter-spacing="8">
    AI DASHBOARD
  </text>
</svg>
