<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="950" height="240">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="950" height="240" rx="24" fill="#08080d" />
  <!-- Brand Icon -->
  <g transform="translate(30, 20) scale(0.24)">
    <circle cx="400" cy="400" r="380" fill="#0f0f18" stroke="#1a1a2e" stroke-width="12" />
    <path d="M 480 100 L 260 420 L 420 420 L 320 700 L 540 380 L 380 380 Z" fill="url(#logoGrad)" filter="url(#glow)" />
  </g>
  <!-- Brand Text -->
  <text x="240" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" fill="#ffffff" letter-spacing="2">
    TOTALSPORT<tspan fill="url(#logoGrad)">BET</tspan>
  </text>
  <text x="242" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#00FF88" letter-spacing="8">
    AI PREDICTIONS
  </text>
</svg>
