<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E2E8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark Background -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="#0F0F18" stroke="#00FF8840" stroke-width="3" />

  <!-- Lightning Bolt Symbol -->
  <path d="M 135 45 L 75 130 L 120 130 L 95 195 L 165 110 L 120 110 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Brand Text -->
  <text x="250" y="115" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="1">TOTALSPORTBET</text>

  <!-- Subtitle Badge -->
  <g transform="translate(250, 140)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#00FF8818" stroke="#00FF8850" stroke-width="1.5" />
    <text x="80" y="23" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" letter-spacing="3" text-anchor="middle">AI DASHBOARD</text>
  </g>
</svg>
