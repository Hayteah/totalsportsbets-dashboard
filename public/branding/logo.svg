<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Rectangle -->
  <rect width="1000" height="1000" rx="200" fill="#08080d" />

  <!-- Outer Ring -->
  <circle cx="500" cy="500" r="430" fill="none" stroke="#00FF88" stroke-width="8" opacity="0.8" />
  <circle cx="500" cy="500" r="400" fill="none" stroke="#00AAFF" stroke-width="4" stroke-dasharray="20 10" opacity="0.5" />

  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- AI Prediction Target Accents -->
  <circle cx="500" cy="500" r="200" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.4" />
</svg>
