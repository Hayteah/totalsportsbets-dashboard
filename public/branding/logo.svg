<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Badge Icon Container -->
  <rect x="20" y="20" width="200" height="200" rx="45" fill="#0f0f18" stroke="url(#logoGradient)" stroke-width="6" />

  <!-- Lightning Bolt Icon inside Badge -->
  <path d="M 135 50 L 75 125 L 115 125 L 90 190 L 150 115 L 110 115 Z" fill="url(#logoGradient)" filter="url(#logoGlow)" />

  <!-- Main Brand Title -->
  <text x="250" y="125" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="2">TOTALSPORTBET</text>

  <!-- Subtitle Tagline -->
  <text x="254" y="175" fill="url(#logoGradient)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="8">AI PREDICTION DASHBOARD</text>
</svg>
