<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Container -->
  <rect width="950" height="240" rx="20" fill="#08080d"/>

  <!-- Left Side Emblem Badge -->
  <rect x="25" y="25" width="190" height="190" rx="30" fill="#0f0f18" stroke="#1a1a2e" stroke-width="3"/>
  <path d="M 140 40 L 70 125 L 115 125 L 85 200 L 165 115 L 120 115 Z" fill="url(#boltGradient)" filter="url(#glow)"/>

  <!-- Right Side Brand Typography -->
  <text x="245" y="125" fill="#e2e2e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="2">TOTALSPORTBET</text>
  <text x="248" y="180" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" letter-spacing="8">AI DASHBOARD</text>
</svg>
