<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container background badge -->
  <rect width="800" height="200" rx="30" fill="#08080d" />
  <rect x="4" y="4" width="792" height="192" rx="26" fill="none" stroke="url(#boltGradient)" stroke-width="2" stroke-opacity="0.25" />

  <!-- Lightning Bolt Icon -->
  <g filter="url(#glow)" transform="translate(30, 25)">
    <rect width="150" height="150" rx="35" fill="url(#boltGradient)" fill-opacity="0.12" stroke="url(#boltGradient)" stroke-width="2" />
    <path d="M 90 25 L 45 85 L 75 85 L 55 130 L 110 65 L 80 65 Z" fill="url(#boltGradient)" />
  </g>

  <!-- Typography -->
  <g transform="translate(210, 110)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="3">TOTALSPORTBET</text>
    <text x="5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#00FF88" letter-spacing="8">AI DASHBOARD</text>
  </g>
</svg>
