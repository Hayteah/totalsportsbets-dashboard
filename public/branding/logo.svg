<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF8825" />
      <stop offset="100%" stop-color="#00AAFF25" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark Container Box -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="#0f0f18" stroke="#00FF88" stroke-width="4" stroke-opacity="0.4" />
  <rect x="20" y="20" width="200" height="200" rx="44" fill="url(#boxGrad)" />

  <!-- Mini Lightning Bolt in container (scaled to fit box 20..220) -->
  <g transform="translate(20, 20) scale(0.2)">
    <path
      d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z"
      fill="url(#logoBoltGrad)"
      filter="url(#logoGlow)"
    />
  </g>

  <!-- Brand Typography -->
  <text x="250" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="3">
    TOTALSPORT<tspan fill="#00FF88">BET</tspan>
  </text>
  <text x="254" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#4a4a5e" letter-spacing="10">
    AI DASHBOARD
  </text>
</svg>
