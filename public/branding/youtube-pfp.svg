<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="ytGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <filter id="ytFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="1000" height="1000" fill="#08080d"/>

  <!-- YouTube Circular Outer Boundary -->
  <circle cx="500" cy="500" r="460" fill="#0f0f18" stroke="url(#ytGlow)" stroke-width="14" filter="url(#ytFilter)"/>
  <circle cx="500" cy="500" r="430" fill="#12121e" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Glowing Octagon / Shield -->
  <polygon points="500,120 760,220 860,480 760,740 500,840 240,740 140,480 240,220" fill="#0a0a12" stroke="url(#ytGlow)" stroke-width="4" stroke-dasharray="16 12"/>

  <!-- Central Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#ytFilter)"/>

  <!-- Platform Badge Top -->
  <rect x="420" y="100" width="160" height="38" rx="19" fill="#12121e" stroke="#FF0055" stroke-width="2"/>
  <text x="500" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#FF0055" letter-spacing="2" text-anchor="middle">YOUTUBE</text>

  <!-- Brand Typography Pill -->
  <rect x="250" y="730" width="500" height="68" rx="34" fill="#08080d" stroke="url(#boltGrad)" stroke-width="4"/>
  <text x="500" y="774" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3" text-anchor="middle">TOTALSPORTBET <tspan fill="#00FF88">AI</tspan></text>
</svg>
