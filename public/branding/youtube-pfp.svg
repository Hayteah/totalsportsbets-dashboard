<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#00FF88" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#00AAFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <filter id="ytGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Center Energy Glow -->
  <circle cx="500" cy="500" r="440" fill="url(#centerGlow)" />

  <!-- YouTube Red Accent Ring -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="#FF0033" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="500" cy="500" r="452" fill="none" stroke="#00FF88" stroke-width="6" stroke-dasharray="300 200 100 200" stroke-linecap="round" opacity="0.85" />

  <!-- Inner High Energy Rings -->
  <circle cx="500" cy="500" r="370" fill="none" stroke="#00AAFF" stroke-width="3" stroke-dasharray="40 20" opacity="0.3" />

  <!-- Centered Lightning Bolt -->
  <path
    d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z"
    fill="url(#boltGradient)"
    filter="url(#ytGlow)"
  />
</svg>
