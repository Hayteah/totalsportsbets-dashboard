<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="ytBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180f15"/>
      <stop offset="70%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>

    <linearGradient id="ytRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>

    <linearGradient id="ytBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>

    <filter id="ytGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#ytBg)"/>

  <!-- Outer Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#ytRing)" stroke-width="14" filter="url(#ytGlow)"/>

  <!-- Shield Badge -->
  <path d="M 500 160 L 780 260 L 720 660 L 500 840 L 280 660 L 220 260 Z" fill="#0f0f18" stroke="url(#ytBolt)" stroke-width="6" filter="url(#ytGlow)"/>

  <!-- Lightning Bolt Symbol -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#ytBolt)"/>

  <!-- Play Button Accent Triangle overlaid on emblem -->
  <polygon points="500,430 500,570 610,500" fill="#FF0000" opacity="0.85" filter="url(#ytGlow)"/>

  <!-- Typography -->
  <text x="500" y="890" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" letter-spacing="5" fill="#FFFFFF" text-anchor="middle">TOTALSPORTBET</text>
  <text x="500" y="930" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="7" fill="#FF4444" text-anchor="middle">YOUTUBE OFFICIAL</text>
</svg>
