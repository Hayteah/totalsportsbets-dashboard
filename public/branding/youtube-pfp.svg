<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="ytBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="ytGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Outer YouTube Red Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="#FF0000" stroke-width="20" opacity="0.85" />

  <!-- Inner Glow Accent Ring -->
  <circle cx="500" cy="500" r="410" fill="#0f0f18" stroke="#00FF88" stroke-width="6" stroke-opacity="0.3" />

  <!-- Central Lightning Bolt Motif -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#ytBolt)" filter="url(#ytGlow)" />

  <!-- Subtitle Badge -->
  <rect x="300" y="810" width="400" height="70" rx="35" fill="#08080d" stroke="#FF0000" stroke-width="3" />
  <text x="500" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#FF0000" text-anchor="middle" letter-spacing="4">YOUTUBE</text>
</svg>
