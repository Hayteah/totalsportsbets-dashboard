<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00AAFF" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#00FF88" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ytRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Ambient Center Glow -->
  <circle cx="500" cy="500" r="460" fill="url(#bgGlow)" />

  <!-- YouTube Circular Safe Area Ring -->
  <circle cx="500" cy="500" r="450" fill="none" stroke="url(#ytRing)" stroke-width="12" filter="url(#glow)" />
  <circle cx="500" cy="500" r="430" fill="none" stroke="#1a1a2e" stroke-width="4" />

  <!-- Center Hexagon / Badge -->
  <polygon points="500,160 780,320 780,680 500,840 220,680 220,320" fill="#0c0c14" stroke="#00FF8840" stroke-width="4" />

  <!-- Lightning Bolt Symbol -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" />

  <!-- Brand Title -->
  <text x="500" y="890" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TOTALSPORTBET</text>
</svg>
