<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glowYt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Outer Circle -->
  <circle cx="500" cy="500" r="460" fill="#0f0f18" stroke="url(#ytGrad)" stroke-width="24" />

  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glowYt)" />

  <!-- Bottom YouTube Badge -->
  <rect x="360" y="820" width="280" height="70" rx="35" fill="url(#ytGrad)" />
  <text x="500" y="865" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="2">YOUTUBE</text>
</svg>
