<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d" />
      <stop offset="100%" stop-color="#0f0f18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGradient)" />

  <!-- YouTube Banner Badge Border -->
  <circle cx="500" cy="500" r="450" fill="none" stroke="#1a1a2e" stroke-width="8" />

  <!-- Outer Play Triangle Concept Glow -->
  <circle cx="500" cy="500" r="410" fill="#0f0f18" stroke="url(#boltGradient)" stroke-width="12" />

  <!-- Lightning Bolt Symbol -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#glow)" />

  <!-- Text Branding -->
  <text x="500" y="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">TOTALSPORTBET</text>
  <text x="500" y="905" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#00AAFF" text-anchor="middle" letter-spacing="10">YOUTUBE OFFICIAL</text>
</svg>
