<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090912" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00AAFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />
  <circle cx="500" cy="450" r="380" fill="url(#glowGrad)" />

  <!-- Twitter / X Sleek Frame -->
  <circle cx="500" cy="500" r="450" fill="none" stroke="url(#boltGrad)" stroke-width="4" stroke-opacity="0.5" />
  <circle cx="500" cy="500" r="430" fill="none" stroke="url(#boltGrad)" stroke-width="8" stroke-opacity="0.8" />

  <!-- Lightning Bolt Symbol -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" />

  <!-- Text Branding -->
  <text x="500" y="870" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="4">TOTALSPORTBET</text>
  <text x="500" y="915" text-anchor="middle" fill="#00AAFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" letter-spacing="8">AI PICKS</text>
</svg>
