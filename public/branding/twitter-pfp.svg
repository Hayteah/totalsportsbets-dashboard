<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="twBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#101424"/>
      <stop offset="70%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>

    <linearGradient id="twRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AAFF"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#1DA1F2"/>
    </linearGradient>

    <linearGradient id="twBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>

    <filter id="twGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#twBg)"/>

  <!-- Outer Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#twRing)" stroke-width="14" filter="url(#twGlow)"/>

  <!-- Diamond Crest -->
  <polygon points="500,160 840,500 500,840 160,500" fill="#0f0f18" stroke="url(#twRing)" stroke-width="6"/>

  <!-- Lightning Bolt Symbol -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#twBolt)" filter="url(#twGlow)"/>

  <!-- Typography -->
  <text x="500" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" letter-spacing="6" fill="#FFFFFF" text-anchor="middle">TOTALSPORTBET</text>
  <text x="500" y="925" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="8" fill="#1DA1F2" text-anchor="middle">X / TWITTER PREDICTIONS</text>
</svg>
