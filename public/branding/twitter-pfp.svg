<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00AAFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#08080d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00AAFF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d"/>

  <!-- Radial Glow -->
  <circle cx="500" cy="500" r="430" fill="url(#glow)"/>

  <!-- Outer Safe Circle Border -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#boltGradient)" stroke-width="10" opacity="0.7"/>

  <!-- Tech Grid Lines -->
  <path d="M 100 500 H 900 M 500 100 V 900" stroke="#1a1a2e" stroke-width="2" opacity="0.5"/>

  <!-- Centered Lightning Bolt Emblem -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#shadow)"/>
</svg>
