<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="twBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a" />
      <stop offset="100%" stop-color="#0e0e1a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#twBg)" />
  <circle cx="500" cy="500" r="460" fill="none" stroke="#00AAFF" stroke-width="12" stroke-opacity="0.4" />

  <!-- Sharp Geometric Accent Lines -->
  <path d="M 100 200 L 900 800 M 100 800 L 900 200" stroke="#00FF88" stroke-opacity="0.06" stroke-width="10" />

  <!-- Central Emblem -->
  <g filter="url(#neonGlow)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Text Label -->
  <text x="500" y="870" text-anchor="middle" fill="#FFFFFF" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" letter-spacing="6">TOTALSPORTBET</text>
  <text x="500" y="915" text-anchor="middle" fill="#00AAFF" font-family="'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="700" letter-spacing="8">@TOTALSPORTBET</text>
</svg>
