<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00AAFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />
  <circle cx="500" cy="500" r="460" fill="url(#bgGlow)" />

  <!-- Outer Circular Border -->
  <circle cx="500" cy="500" r="470" fill="none" stroke="url(#boltGrad)" stroke-width="10" />

  <!-- Center Lightning Bolt -->
  <g filter="url(#neonGlow)">
    <path d="M 580 190 L 360 510 L 520 510 L 420 790 L 640 470 L 480 470 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Title & Tagline -->
  <text x="500" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="7" text-anchor="middle">TOTALSPORTBET</text>
  <text x="500" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#00AAFF" letter-spacing="4" text-anchor="middle">@TOTALSPORTBET</text>
</svg>
