<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="twGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DA1F2"/>
      <stop offset="50%" stop-color="#00AAFF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <filter id="twFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="1000" height="1000" fill="#08080d"/>

  <!-- Twitter Circular Safe Crop Zone -->
  <circle cx="500" cy="500" r="460" fill="#0f0f18" stroke="url(#twGlow)" stroke-width="14" filter="url(#twFilter)"/>
  <circle cx="500" cy="500" r="430" fill="#12121e" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Diagonal Cyber Speed Rays -->
  <line x1="200" y1="300" x2="800" y2="300" stroke="#00AAFF" stroke-width="2" opacity="0.3"/>
  <line x1="150" y1="500" x2="850" y2="500" stroke="#00FF88" stroke-width="3" opacity="0.4"/>
  <line x1="200" y1="700" x2="800" y2="700" stroke="#00AAFF" stroke-width="2" opacity="0.3"/>

  <!-- Central Lightning Bolt Icon -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#twFilter)"/>

  <!-- Platform Badge Top -->
  <rect x="420" y="100" width="160" height="38" rx="19" fill="#12121e" stroke="#1DA1F2" stroke-width="2"/>
  <text x="500" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#1DA1F2" letter-spacing="2" text-anchor="middle">TWITTER / X</text>

  <!-- Brand Typography Pill -->
  <rect x="250" y="730" width="500" height="68" rx="34" fill="#08080d" stroke="url(#boltGrad)" stroke-width="4"/>
  <text x="500" y="774" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3" text-anchor="middle">TOTALSPORTBET <tspan fill="#00FF88">AI</tspan></text>
</svg>
