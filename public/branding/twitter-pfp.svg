<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="50%" stop-color="#00AAFF"/>
      <stop offset="100%" stop-color="#1DA1F2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1000" height="1000" fill="#08080d"/>

  <!-- Inner Card Circle -->
  <circle cx="500" cy="500" r="440" fill="#0f0f18" stroke="#1a1a2e" stroke-width="4"/>
  <circle cx="500" cy="500" r="380" fill="none" stroke="#12121e" stroke-width="2" stroke-dasharray="12 12"/>

  <!-- Twitter / X Accent Outer Ring -->
  <circle cx="500" cy="500" r="460" stroke="url(#twGrad)" stroke-width="12" fill="none" filter="url(#glow)"/>

  <!-- Geometric accent lines -->
  <line x1="200" y1="200" x2="800" y2="800" stroke="#1a1a2e" stroke-width="3" opacity="0.4"/>
  <line x1="800" y1="200" x2="200" y2="800" stroke="#1a1a2e" stroke-width="3" opacity="0.4"/>

  <!-- Centered Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#glow)"/>

  <!-- Sub Text -->
  <text x="500" y="850" text-anchor="middle" fill="#e2e2e8" font-family="-apple-system, sans-serif" font-weight="800" font-size="32" letter-spacing="4">TOTALSPORTBET AI</text>
</svg>
