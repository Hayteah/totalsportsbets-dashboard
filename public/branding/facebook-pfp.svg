  <text x="500" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#1877F2" text-anchor="middle" letter-spacing="6">FACEBOOK AI</text>
