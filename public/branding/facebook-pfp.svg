<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#08080d" />
      <stop offset="100%" stop-color="#030306" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Facebook Blue Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#fbGrad)" stroke-width="12" opacity="0.85" />

  <!-- Cyber / AI Prediction Ring -->
  <circle cx="500" cy="500" r="410" fill="none" stroke="#00FF88" stroke-width="4" stroke-dasharray="30 15 10 15" opacity="0.6" />

  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- AI Prediction Target Accents -->
  <circle cx="500" cy="500" r="220" fill="none" stroke="#1877F2" stroke-width="2" stroke-dasharray="40 20" opacity="0.5" />

  <!-- Text Badge -->
  <rect x="300" y="800" width="400" height="52" rx="26" fill="#10101c" stroke="#1877F2" stroke-width="2" />
  <text x="500" y="833" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#00FF88" text-anchor="middle" letter-spacing="3">TOTALSPORTBET <tspan fill="#1877F2">AI</tspan></text>
</svg>
