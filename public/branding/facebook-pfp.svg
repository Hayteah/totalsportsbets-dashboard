<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="fbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#08080d" />
  <!-- Facebook Frame -->
  <circle cx="500" cy="500" r="480" fill="none" stroke="url(#fbGradient)" stroke-width="16" opacity="0.8" />
  <circle cx="500" cy="500" r="450" fill="#0c0c14" />
  <circle cx="500" cy="500" r="350" fill="url(#boltGrad)" opacity="0.08" />

  <!-- Central Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Brand Name Text -->
  <text x="500" y="880" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="6">TOTALSPORTBET</text>
  <text x="500" y="925" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="10">AI PREDICTIONS</text>
</svg>
