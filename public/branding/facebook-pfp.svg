<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="#08080D" />
  <circle cx="500" cy="500" r="460" fill="#0F0F18" stroke="#1877F280" stroke-width="12" />
  <circle cx="500" cy="500" r="380" fill="none" stroke="#00FF8830" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Central Lightning Bolt Symbol -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Platform Badge in Corner -->
  <g transform="translate(680, 680)">
    <circle cx="90" cy="90" r="90" fill="#1877F2" />
    <path d="M 102 150 L 102 102 L 118 102 L 121 83 L 102 83 L 102 71 C 102 65 104 61 112 61 L 122 61 L 122 44 C 117 43 110 42 102 42 C 86 42 75 52 75 70 L 75 83 L 58 83 L 58 102 L 75 102 L 75 150 Z" fill="#FFFFFF" />
