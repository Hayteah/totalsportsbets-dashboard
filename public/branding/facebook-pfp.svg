<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="fbBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="70%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>

    <linearGradient id="fbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2"/>
      <stop offset="50%" stop-color="#00AAFF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>

    <linearGradient id="fbBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#1877F2"/>
    </linearGradient>

    <filter id="fbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#fbBg)"/>

  <!-- Outer Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#fbRing)" stroke-width="16" filter="url(#fbGlow)"/>

  <!-- Modern Octagon Shield -->
  <polygon points="350,160 650,160 840,350 840,650 650,840 350,840 160,650 160,350" fill="#0f0f18" stroke="url(#fbRing)" stroke-width="6"/>

  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#fbBolt)" filter="url(#fbGlow)"/>

  <!-- Subtitle Text -->
  <text x="500" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" letter-spacing="6" fill="#FFFFFF" text-anchor="middle">TOTALSPORTBET</text>
  <text x="500" y="925" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="8" fill="#1877F2" text-anchor="middle">COMMUNITY AI</text>
</svg>
