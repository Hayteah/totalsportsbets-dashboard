<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d" />
      <stop offset="100%" stop-color="#121220" />
    </linearGradient>
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Facebook Blue Ring -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#fbGrad)" stroke-width="20" opacity="0.9" />
  <circle cx="500" cy="500" r="430" fill="none" stroke="url(#boltGrad)" stroke-width="8" opacity="0.4" />

  <!-- Central Badge -->
  <circle cx="500" cy="500" r="360" fill="#0c0c16" stroke="#1877F230" stroke-width="4" />

  <!-- Lightning Bolt Symbol -->
  <g filter="url(#glow)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Brand Subtext -->
  <text x="500" y="860" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="8">TOTALSPORTBET</text>
  <text x="500" y="905" text-anchor="middle" fill="#1877F2" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="12">AI PREDICTIONS</text>
</svg>
