<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#0f0f18"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="1000" rx="200" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="960" rx="180" fill="none" stroke="#1a1a2e" stroke-width="8"/>

  <!-- Subtle Cyber Tech Grid Pattern Lines -->
  <line x1="100" y1="200" x2="900" y2="200" stroke="#1a1a2e" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="500" x2="900" y2="500" stroke="#1a1a2e" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="800" x2="900" y2="800" stroke="#1a1a2e" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="100" x2="200" y2="900" stroke="#1a1a2e" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="100" x2="500" y2="900" stroke="#1a1a2e" stroke-width="2" opacity="0.6"/>
  <line x1="800" y1="100" x2="800" y2="900" stroke="#1a1a2e" stroke-width="2" opacity="0.6"/>

  <!-- Outer Neon Halo -->
  <circle cx="500" cy="460" r="320" fill="none" stroke="url(#primaryGrad)" stroke-width="12" filter="url(#neonGlow)" opacity="0.8"/>
  <circle cx="500" cy="460" r="320" fill="none" stroke="url(#primaryGrad)" stroke-width="4"/>

  <!-- Inner Tech Accents -->
  <circle cx="500" cy="460" r="280" fill="#12121e" stroke="#00FF88" stroke-width="2" stroke-dasharray="16 12"/>

  <!-- Central Lightning Bolt Icon -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#primaryGrad)" filter="url(#neonGlow)"/>

  <!-- Brand Typography Badge -->
  <rect x="250" y="810" width="500" height="64" rx="32" fill="#12121e" stroke="url(#primaryGrad)" stroke-width="3"/>
  <text x="500" y="852" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" fill="#ffffff" letter-spacing="4" text-anchor="middle">TOTALSPORTBET <tspan fill="#00FF88">AI</tspan></text>
</svg>
