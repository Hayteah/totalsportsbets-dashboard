<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00AAFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#08080d" />
  <!-- Tech Grid Accent Lines -->
  <circle cx="500" cy="500" r="420" stroke="url(#boltGradient)" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="500" cy="500" r="340" stroke="url(#boltGradient)" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="500" cy="500" r="260" fill="url(#glowGradient)" filter="url(#glow)" />
  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#glow)" />
</svg>
