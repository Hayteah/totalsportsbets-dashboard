<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00AAFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" rx="220" fill="#08080d" />
  <rect width="1000" height="1000" rx="220" fill="url(#bgGlow)" />
  <rect x="10" y="10" width="980" height="980" rx="210" fill="none" stroke="#1a1a2e" stroke-width="10" />

  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" />
</svg>
