<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="igRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glowIg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Outer Instagram Story Gradient Ring -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#igRing)" stroke-width="24" />

  <!-- Inner Dark Circle -->
  <circle cx="500" cy="500" r="430" fill="#0f0f18" stroke="#1a1a2e" stroke-width="8" />

  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glowIg)" />

  <!-- Bottom Instagram Platform Badge -->
  <rect x="350" y="820" width="300" height="70" rx="35" fill="url(#igRing)" />
  <text x="500" y="865" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="2">INSTAGRAM</text>
</svg>
