<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="#08080d" />
  <circle cx="500" cy="500" r="480" fill="url(#bgGlow)" />

  <!-- Outer Ring with IG Accent -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#igGradient)" stroke-width="12" />
  <circle cx="500" cy="500" r="430" fill="none" stroke="url(#boltGradient)" stroke-width="6" stroke-dasharray="20 10" />

  <!-- Centered Lightning Bolt Icon -->
  <g transform="translate(0, -60) scale(1.1) transform-origin(500 500)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" />
  </g>

  <!-- Text Branding -->
  <text x="500" y="820" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TOTALSPORTBET</text>
  <text x="500" y="875" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="24" fill="#00FF88" text-anchor="middle" letter-spacing="6">INSTAGRAM OFFICIAL</text>
</svg>
