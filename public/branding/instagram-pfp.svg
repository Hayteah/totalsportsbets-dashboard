<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="igRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833AB4" />
      <stop offset="50%" stop-color="#FD1D1D" />
      <stop offset="100%" stop-color="#FCB045" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />
  <!-- Circular Safe Guide Ring for IG Profile -->
  <circle cx="500" cy="500" r="460" stroke="url(#igRing)" stroke-width="12" />
  <circle cx="500" cy="500" r="430" fill="#0c0c14" />
  <!-- Inner Tech Circle -->
  <circle cx="500" cy="500" r="320" stroke="url(#boltGradient)" stroke-dasharray="12 12" stroke-opacity="0.3" stroke-width="3" />
  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#glow)" />
</svg>
