<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="igGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833AB4" />
      <stop offset="50%" stop-color="#FD1D1D" />
      <stop offset="100%" stop-color="#FCB045" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="24" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Theme Background Rectangle -->
  <rect width="1000" height="1000" fill="#08080d"/>

  <!-- Instagram Accent Ring -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#igGradient)" stroke-width="16"/>

  <!-- Neon Inner Ring -->
  <circle cx="500" cy="500" r="430" fill="#0f0f18" stroke="url(#boltGradient)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Glowing Aura Circle -->
  <circle cx="500" cy="500" r="280" fill="#00FF88" opacity="0.1" filter="url(#glow)"/>

  <!-- Standard Centered Lightning Bolt Path -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#glow)"/>
</svg>
