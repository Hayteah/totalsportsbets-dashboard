<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="igGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="50%" stop-color="#00AAFF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#08080d" />
  <!-- Instagram Ring Accent -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#igGradient)" stroke-width="28" />
  <circle cx="500" cy="500" r="400" fill="#0f0f18" stroke="#1a1a2e" stroke-width="8" />
  <!-- AI Grid Matrix background overlay -->
  <circle cx="500" cy="500" r="320" fill="none" stroke="#00FF8815" stroke-width="2" stroke-dasharray="12,12" />
  <!-- Centered Lightning Bolt Emblem -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#glow)" />
  <text x="500" y="870" text-anchor="middle" fill="#E2E2E8" font-family="-apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="6">TOTALSPORTBET AI</text>
</svg>
