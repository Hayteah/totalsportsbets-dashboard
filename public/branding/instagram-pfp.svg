<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="igRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="50%" stop-color="#00AAFF" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Outer Instagram Gradient Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#igRing)" stroke-width="20" />
  <circle cx="500" cy="500" r="410" fill="#0f0f18" stroke="#1a1a2e" stroke-width="8" />

  <!-- Inner Tech Decorative Glow Circle -->
  <circle cx="500" cy="500" r="320" fill="none" stroke="#00FF8820" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Center Lightning Bolt -->
  <g filter="url(#glow)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" />
  </g>

  <!-- Brand Title -->
  <text x="500" y="870" text-anchor="middle" fill="#e2e2e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="42" letter-spacing="6">TOTALSPORTBET</text>
  <text x="500" y="910" text-anchor="middle" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="24" letter-spacing="8">AI PREDICTIONS</text>
</svg>
