<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d" />
      <stop offset="100%" stop-color="#121220" />
    </linearGradient>
    <linearGradient id="igRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#00FF88" />
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- IG Gradient Accent Outer Ring -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#igRing)" stroke-width="24" opacity="0.9" />

  <!-- Neon Inner Ring -->
  <circle cx="500" cy="500" r="430" fill="none" stroke="url(#boltGrad)" stroke-width="8" opacity="0.4" />

  <!-- Central Badge Shadow & Base -->
  <circle cx="500" cy="500" r="360" fill="#0c0c16" stroke="#00FF8830" stroke-width="4" />

  <!-- Lightning Bolt Symbol -->
  <g filter="url(#glow)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Brand Subtext -->
  <text x="500" y="860" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="8">TOTALSPORTBET</text>
  <text x="500" y="905" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="12">AI PREDICTIONS</text>
</svg>
