<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="igGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="50%" stop-color="#00AAFF"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1000" height="1000" fill="#08080d"/>

  <!-- Instagram Circular Frame Ring (Inside 1000x1000 safe circle) -->
  <circle cx="500" cy="500" r="460" fill="#0f0f18" stroke="url(#igGlow)" stroke-width="16" filter="url(#glow)"/>
  <circle cx="500" cy="500" r="430" fill="#12121e" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Radial Tech Circuit Circles -->
  <circle cx="500" cy="500" r="340" fill="none" stroke="#00FF88" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="20 12"/>
  <circle cx="500" cy="500" r="250" fill="none" stroke="#00AAFF" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Central Lightning Bolt Icon (Safe Crop Zone) -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Bottom Brand Pill Badge -->
  <rect x="260" y="720" width="480" height="68" rx="34" fill="#08080d" stroke="url(#boltGrad)" stroke-width="4"/>
  <text x="500" y="764" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3" text-anchor="middle">TOTALSPORTBET <tspan fill="#00FF88">AI</tspan></text>

  <!-- Top IG Platform Badge Tag -->
  <rect x="420" y="100" width="160" height="38" rx="19" fill="#12121e" stroke="#00FF88" stroke-width="2"/>
  <text x="500" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#00FF88" letter-spacing="2" text-anchor="middle">INSTAGRAM</text>
</svg>
