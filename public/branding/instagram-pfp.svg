<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
  </defs>

  <!-- Dark Base Background -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Center Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" />

  <!-- Instagram Badge -->
  <g transform="translate(720, 720)">
    <circle cx="100" cy="100" r="110" fill="#08080d" />
    <circle cx="100" cy="100" r="95" fill="url(#igGrad)" />
    <rect x="45" y="45" width="110" height="110" rx="30" fill="none" stroke="#ffffff" stroke-width="12" />
    <circle cx="100" cy="100" r="30" fill="none" stroke="#ffffff" stroke-width="12" />
    <circle cx="132" cy="68" r="8" fill="#ffffff" />
  </g>
</svg>
