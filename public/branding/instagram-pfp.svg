<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="igRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />
  <circle cx="500" cy="500" r="450" fill="url(#bgGlow)" />

  <!-- Outer Instagram Gradient Ring -->
  <circle cx="500" cy="500" r="450" fill="none" stroke="url(#igRing)" stroke-width="18" />
  <circle cx="500" cy="500" r="425" fill="none" stroke="#00FF88" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Lightning Bolt Symbol -->
  <g transform="translate(500, 500) scale(0.65) translate(-500, -500)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  </g>

  <!-- Brand Title Text -->
  <text x="500" y="820" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">TOTALSPORT<tspan fill="#00FF88">BET</tspan></text>
  <text x="500" y="865" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#00AAFF" text-anchor="middle" letter-spacing="8">AI PREDICTIONS</text>
</svg>
