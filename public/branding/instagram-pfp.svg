<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />
  <circle cx="500" cy="500" r="450" fill="url(#bgGlow)" />

  <!-- Outer Instagram Gradient Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#igGrad)" stroke-width="12" opacity="0.85" />

  <!-- Inner Dashboard Accent Ring -->
  <circle cx="500" cy="500" r="410" fill="none" stroke="url(#brandGrad)" stroke-width="4" opacity="0.6" stroke-dasharray="12 8" />

  <!-- Centered Lightning Bolt Logo -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#brandGrad)" filter="drop-shadow(0px 0px 20px rgba(0, 255, 136, 0.4))" />
</svg>