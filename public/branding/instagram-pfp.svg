<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#08080d" />
      <stop offset="100%" stop-color="#030306" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Instagram Gradient Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#instaGrad)" stroke-width="12" opacity="0.85" />

  <!-- Cyber / AI Prediction Ring -->
  <circle cx="500" cy="500" r="410" fill="none" stroke="#00FF88" stroke-width="4" stroke-dasharray="20 10 5 10" opacity="0.6" />
  <circle cx="500" cy="500" r="380" fill="none" stroke="#00AAFF" stroke-width="2" stroke-dasharray="40 15" opacity="0.4" />

  <!-- Background Glow Element -->
  <circle cx="500" cy="500" r="250" fill="#00FF88" opacity="0.08" filter="url(#strongGlow)" />

  <!-- Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- AI Prediction Target Accents -->
  <circle cx="500" cy="500" r="180" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.3" />
  <line x1="500" y1="280" x2="500" y2="320" stroke="#00FF88" stroke-width="3" opacity="0.6" />
  <line x1="500" y1="680" x2="500" y2="720" stroke="#00FF88" stroke-width="3" opacity="0.6" />
  <line x1="280" y1="500" x2="320" y2="500" stroke="#00FF88" stroke-width="3" opacity="0.6" />
  <line x1="680" y1="500" x2="720" y2="500" stroke="#00FF88" stroke-width="3" opacity="0.6" />

  <!-- Text Badge -->
  <rect x="320" y="810" width="360" height="50" rx="25" fill="#10101c" stroke="#00FF88" stroke-width="2" />
  <text x="500" y="842" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#00FF88" text-anchor="middle" letter-spacing="3">TOTALSPORTBET</text>
</svg>
