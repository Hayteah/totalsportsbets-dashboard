<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c14" />
      <stop offset="50%" stop-color="#08080d" />
      <stop offset="100%" stop-color="#0f0f18" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00AAFF" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGradient)" />
  <circle cx="500" cy="500" r="450" fill="none" stroke="#1a1a2e" stroke-width="4" />
  <circle cx="500" cy="500" r="380" fill="url(#glowGradient)" />

  <!-- Outer Glow Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" opacity="0.4" filter="url(#neonGlow)" />

  <!-- Main Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" stroke="#00FF88" stroke-width="4" stroke-linejoin="round" />

  <!-- Subtext/Brand mark -->
  <text x="500" y="870" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#00FF88" letter-spacing="8" text-anchor="middle">TOTALSPORTBET</text>
</svg>
