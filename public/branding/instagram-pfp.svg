<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="igBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08080d" />
      <stop offset="50%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#12121e" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#igBg)" />
  <!-- Instagram Circle Safe Guide Frame -->
  <circle cx="500" cy="500" r="460" fill="#0f0f18" stroke="#00FF88" stroke-width="8" stroke-opacity="0.4" />
  <circle cx="500" cy="500" r="420" fill="none" stroke="#00AAFF" stroke-width="4" stroke-dasharray="16 16" stroke-opacity="0.5" />
  <!-- Centered Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
