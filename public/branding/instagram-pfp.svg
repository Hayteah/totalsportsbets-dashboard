<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#00AAFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="50%" stop-color="#00AAFF" />
      <stop offset="100%" stop-color="#FF00AA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1000" height="1000" fill="#08080d" />

  <!-- Ambient Center Glow -->
  <circle cx="500" cy="500" r="450" fill="url(#bgGlow)" />

  <!-- Outer Instagram Gradient Ring Accent -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#ringGradient)" stroke-width="8" opacity="0.8" />
  <circle cx="500" cy="500" r="420" fill="none" stroke="#1a1a2e" stroke-width="2" />

  <!-- Center Badge Circle -->
  <circle cx="500" cy="500" r="320" fill="#0c0c14" stroke="#00FF8830" stroke-width="3" filter="url(#glow)" />

  <!-- Lightning Bolt Symbol -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" />

  <!-- Brand Title -->
  <text x="500" y="880" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TOTALSPORTBET</text>
  <text x="500" y="920" font-family="'Inter', 'Arial', sans-serif" font-size="20" font-weight="700" fill="#00FF88" text-anchor="middle" letter-spacing="8">AI PREDICTIONS</text>
</svg>
