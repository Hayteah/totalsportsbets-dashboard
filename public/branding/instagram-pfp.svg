<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151528"/>
      <stop offset="60%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>

    <linearGradient id="igGlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF543E"/>
      <stop offset="30%" stop-color="#C13584"/>
      <stop offset="65%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>

    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>

    <filter id="pfpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)"/>

  <!-- Instagram Circular Outline Ring -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#igGlowGrad)" stroke-width="16" filter="url(#pfpGlow)"/>
  <circle cx="500" cy="500" r="410" fill="none" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Inner Crest Hexagon -->
  <polygon points="500,180 760,320 760,680 500,820 240,680 240,320" fill="#0f0f18" stroke="url(#boltGradient)" stroke-width="8" filter="url(#pfpGlow)"/>
  <polygon points="500,205 735,335 735,665 500,795 265,665 265,335" fill="#12121e" stroke="#2a2a3e" stroke-width="3"/>

  <!-- Central Lightning Emblem -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" filter="url(#pfpGlow)"/>

  <!-- Text Mark for Brand -->
  <text x="500" y="875" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" letter-spacing="6" fill="#FFFFFF" text-anchor="middle">TOTALSPORTBET</text>
  <text x="500" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#00FF88" text-anchor="middle">AI PREDICTIONS</text>
</svg>
