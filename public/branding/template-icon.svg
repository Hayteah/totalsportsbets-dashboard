<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c14" />
      <stop offset="50%" stop-color="#12121f" />
      <stop offset="100%" stop-color="#07070a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Template -->
  <rect width="1080" height="1350" fill="url(#cardBg)" rx="40" />
  <rect x="20" y="20" width="1040" height="1310" rx="32" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.3" />

  <!-- Header Branding -->
  <rect x="60" y="60" width="960" height="120" rx="20" fill="#161626" stroke="#2a2a3e" stroke-width="2" />
  <circle cx="120" cy="120" r="36" fill="url(#accentGrad)" />
  <path d="M 126 95 L 105 120 L 118 120 L 112 145 L 133 118 L 120 118 Z" fill="#0c0c14" />
  <text x="180" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="2">TOTALSPORTBET</text>
  <text x="180" y="145" fill="#00FF88" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="4">DAILY AI MATCH PREDICTIONS</text>

  <!-- Central Watermark Bolt -->
  <path d="M 620 400 L 400 720 L 560 720 L 460 1000 L 680 680 L 520 680 Z" fill="url(#accentGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Prediction Card Slots Placeholder -->
  <rect x="60" y="220" width="960" height="240" rx="24" fill="#12121e" stroke="#1a1a2e" stroke-width="2" />
  <rect x="60" y="490" width="960" height="240" rx="24" fill="#12121e" stroke="#1a1a2e" stroke-width="2" />
  <rect x="60" y="760" width="960" height="240" rx="24" fill="#12121e" stroke="#1a1a2e" stroke-width="2" />

  <!-- Footer Tag -->
  <rect x="60" y="1180" width="960" height="100" rx="20" fill="url(#accentGrad)" opacity="0.15" />
  <text x="540" y="1240" text-anchor="middle" fill="#00FF88" font-family="system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="3">POWERED BY CLAUDE &amp; AI-FOOTBALL ANALYTICS</text>
</svg>
