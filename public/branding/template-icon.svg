<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="tmplGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Overlay Framework Frame -->
  <rect x="20" y="20" width="760" height="760" rx="40" fill="none" stroke="url(#tmplGrad)" stroke-width="8" opacity="0.6" />
  <rect x="40" y="40" width="720" height="720" rx="30" fill="#0c0c14" fill-opacity="0.9" stroke="#1a1a2e" stroke-width="4" />

  <!-- Background Watermark Lightning -->
  <path d="M 460 140 L 290 410 L 410 410 L 330 660 L 520 370 L 390 370 Z" fill="url(#tmplGrad)" opacity="0.08" />

  <!-- Corner Branded Accents -->
  <path d="M 40 100 L 40 70 C 40 53.431 53.431 40 70 40 L 100 40" stroke="url(#tmplGrad)" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M 700 40 L 730 40 C 746.569 40 760 53.431 760 70 L 760 100" stroke="url(#tmplGrad)" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M 760 700 L 760 730 C 760 746.569 746.569 760 730 760 L 700 760" stroke="url(#tmplGrad)" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M 100 760 L 70 760 C 53.431 760 40 746.569 40 730 L 40 700" stroke="url(#tmplGrad)" stroke-width="12" fill="none" stroke-linecap="round" />

  <!-- Header Branding Shield -->
  <g transform="translate(400, 200)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="90" fill="#12121e" stroke="url(#tmplGrad)" stroke-width="6" />
    <path d="M 20 -60 L -30 10 L 10 10 L -15 65 L 35 -10 L 0 -10 Z" fill="url(#tmplGrad)" />
  </g>

  <!-- Text Header Mockup -->
  <text x="400" y="360" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">TOTALSPORT<tspan fill="#00FF88">BET</tspan></text>
  <text x="400" y="400" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#00AAFF" text-anchor="middle" letter-spacing="4">AI PREDICTION OVERLAY</text>

  <!-- Prediction Data Placeholder Box -->
  <rect x="120" y="450" width="560" height="220" rx="20" fill="#12121e" stroke="#1a1a2e" stroke-width="3" />
  <text x="400" y="520" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">MATCH / PICK / ODDS</text>
  <rect x="250" y="560" width="300" height="60" rx="30" fill="#00FF8818" stroke="#00FF8860" stroke-width="2" />
  <text x="400" y="600" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="22" fill="#00FF88" text-anchor="middle" letter-spacing="2">HIGH CONFIDENCE AI PICK</text>
</svg>