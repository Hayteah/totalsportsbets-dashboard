<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="tmplBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="tmplGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle pattern grid -->
  <rect width="1000" height="1000" fill="#0f0f18" />

  <!-- Subtle Grid Overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000" />
    <line x1="200" y1="0" x2="200" y2="1000" />
    <line x1="300" y1="0" x2="300" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="500" y1="0" x2="500" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
    <line x1="700" y1="0" x2="700" y2="1000" />
    <line x1="800" y1="0" x2="800" y2="1000" />
    <line x1="900" y1="0" x2="900" y2="1000" />

    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="400" x2="1000" y2="400" />
    <line x1="0" y1="500" x2="1000" y2="500" />
    <line x1="0" y1="600" x2="1000" y2="600" />
    <line x1="0" y1="700" x2="1000" y2="700" />
    <line x1="0" y1="800" x2="1000" y2="800" />
    <line x1="0" y1="900" x2="1000" y2="900" />
  </g>

  <!-- Large Semi-Transparent Background Watermark Bolt -->
  <path d="M 580 150 L 360 470 L 520 470 L 420 850 L 640 430 L 480 430 Z" fill="url(#tmplBolt)" opacity="0.2" filter="url(#tmplGlow)" />

  <!-- Outer Card Frame -->
  <rect width="940" height="940" x="30" y="30" rx="36" fill="none" stroke="#00FF88" stroke-width="4" stroke-opacity="0.3" />
</svg>
