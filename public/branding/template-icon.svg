<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#12121e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Template Frame -->
  <rect width="1000" height="1000" fill="url(#cardGrad)" rx="60" />
  <rect width="980" height="980" x="10" y="10" fill="none" stroke="url(#accentGrad)" stroke-width="6" rx="54" opacity="0.4" />

  <!-- Header Banner Area -->
  <rect width="900" height="160" x="50" y="60" fill="#161626" rx="24" stroke="#1a1a2e" stroke-width="4" />
  <path d="M 130 100 L 90 180 L 135 180 L 110 230 L 160 150 L 125 150 Z" fill="url(#accentGrad)" filter="url(#glow)" transform="translate(-10, -55) scale(0.6)" />
  <text x="140" y="155" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="4">TOTALSPORTBET</text>
  <text x="650" y="155" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="800" font-size="32" letter-spacing="2">DAILY PICKS</text>

  <!-- Match Pick Box 1 -->
  <rect width="900" height="300" x="50" y="260" fill="#12121e" rx="30" stroke="#1a1a2e" stroke-width="4" />
  <rect width="12" height="300" x="50" y="260" fill="url(#accentGrad)" rx="6" />
  <text x="100" y="330" fill="#8b8ba0" font-family="system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="1">CHAMPIONS LEAGUE · 21:00 CET</text>
  <text x="100" y="410" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="44">Bayer Leverkusen vs Arsenal</text>
  <rect width="220" height="70" x="100" y="445" fill="#00FF8815" rx="16" stroke="#00FF8840" stroke-width="2" />
  <text x="130" y="490" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="800" font-size="28">BTTS: YES</text>
  <rect width="140" height="70" x="340" y="445" fill="#161626" rx="16" stroke="#2a2a3e" stroke-width="2" />
  <text x="365" y="490" fill="#00AAFF" font-family="monospace" font-weight="800" font-size="30">@1.75</text>
  <rect width="220" height="70" x="700" y="445" fill="#00FF8820" rx="16" />
  <text x="735" y="490" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="800" font-size="26">HIGH 78%</text>

  <!-- Match Pick Box 2 -->
  <rect width="900" height="300" x="50" y="590" fill="#12121e" rx="30" stroke="#1a1a2e" stroke-width="4" />
  <rect width="12" height="300" x="50" y="590" fill="url(#accentGrad)" rx="6" />
  <text x="100" y="660" fill="#8b8ba0" font-family="system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="1">CHAMPIONS LEAGUE · 21:00 CET</text>
  <text x="100" y="740" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="44">Real Madrid vs Man City</text>
  <rect width="220" height="70" x="100" y="775" fill="#00FF8815" rx="16" stroke="#00FF8840" stroke-width="2" />
  <text x="130" y="820" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="800" font-size="28">BTTS: YES</text>
  <rect width="140" height="70" x="340" y="775" fill="#161626" rx="16" stroke="#2a2a3e" stroke-width="2" />
  <text x="365" y="820" fill="#00AAFF" font-family="monospace" font-weight="800" font-size="30">@1.80</text>
  <rect width="220" height="70" x="700" y="775" fill="#00FF8820" rx="16" />
  <text x="735" y="820" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="800" font-size="26">HIGH 80%</text>

  <!-- Footer -->
  <text x="500" y="940" text-anchor="middle" fill="#4a4a5e" font-family="system-ui, sans-serif" font-weight="700" font-size="24" letter-spacing="2">AI-POWERED PREDICTIONS · TOTALSPORTBET</text>
</svg>
