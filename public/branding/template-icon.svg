<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f0f18" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="1000" rx="40" fill="#0f0f18" stroke="#1a1a2e" stroke-width="8" />
  <rect x="20" y="20" width="960" height="960" rx="30" fill="url(#cardGlow)" />

  <!-- Background Watermark Lightning Bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#brandGrad)" opacity="0.15" />

  <!-- Sports Prediction Graphics -->
  <!-- Target / Accuracy Graphic Outer Ring -->
  <circle cx="500" cy="500" r="320" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-dasharray="20 15" opacity="0.8" />
  <circle cx="500" cy="500" r="240" fill="none" stroke="#00AAFF" stroke-width="6" opacity="0.5" />

  <!-- Center Badge / High Confidence Indicator -->
  <rect x="350" y="470" width="300" height="60" rx="30" fill="#00FF8818" stroke="#00FF88" stroke-width="4" />
  <text x="500" y="510" text-anchor="middle" fill="#00FF88" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="4">HIGH VALUE 88%</text>

  <!-- Foreground Lightning Bolt Accent -->
  <path d="M 530 260 L 410 450 L 490 450 L 440 600 L 570 390 L 480 390 Z" fill="url(#brandGrad)" filter="drop-shadow(0px 0px 15px rgba(0, 255, 136, 0.5))" />

  <!-- Corner Accents -->
  <path d="M 60 120 L 60 60 L 120 60" fill="none" stroke="#00FF88" stroke-width="8" stroke-linecap="round" />
  <path d="M 940 120 L 940 60 L 880 60" fill="none" stroke="#00FF88" stroke-width="8" stroke-linecap="round" />
  <path d="M 60 880 L 60 940 L 120 940" fill="none" stroke="#00FF88" stroke-width="8" stroke-linecap="round" />
  <path d="M 940 880 L 940 940 L 880 940" fill="none" stroke="#00FF88" stroke-width="8" stroke-linecap="round" />

  <!-- Header Brand Text -->
  <text x="500" y="140" text-anchor="middle" fill="#e2e2e8" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="6">TOTALSPORTBET</text>
  <text x="500" y="180" text-anchor="middle" fill="#8b8ba0" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="8">AI PREDICTION</text>
</svg>