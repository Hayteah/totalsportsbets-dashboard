<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#12121e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="1000" rx="40" fill="url(#cardGrad)" stroke="#1a1a2e" stroke-width="8" />

  <!-- Outer Tech Grid / Frame Elements -->
  <rect x="40" y="40" width="920" height="920" rx="30" fill="none" stroke="#00FF8820" stroke-width="4" stroke-dasharray="40 20" />

  <!-- Center Watermark Lightning Bolt -->
  <path d="M 580 180 L 360 500 L 520 500 L 420 780 L 640 460 L 480 460 Z" fill="url(#boltGradient)" opacity="0.15" />

  <!-- Template Header Header Badge -->
  <rect x="250" y="90" width="500" height="70" rx="35" fill="#00FF8815" stroke="#00FF8840" stroke-width="2" />
  <text x="500" y="136" text-anchor="middle" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="32" letter-spacing="4">⚡ AI MATCH PREDICTION</text>

  <!-- Match Info Graphic Placeholder Block -->
  <rect x="100" y="220" width="800" height="340" rx="24" fill="#08080d" stroke="#1a1a2e" stroke-width="4" />

  <!-- Team vs Team Graphic Elements -->
  <circle cx="280" cy="360" r="70" fill="#1a1a2e" stroke="#00AAFF" stroke-width="4" />
  <text x="280" y="372" text-anchor="middle" fill="#e2e2e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="36">TEAM A</text>

  <text x="500" y="375" text-anchor="middle" fill="#FFAA00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="40">VS</text>

  <circle cx="720" cy="360" r="70" fill="#1a1a2e" stroke="#00FF88" stroke-width="4" />
  <text x="720" y="372" text-anchor="middle" fill="#e2e2e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="36">TEAM B</text>

  <!-- Prediction Details Bar -->
  <rect x="100" y="600" width="800" height="180" rx="20" fill="#08080d" stroke="#00FF8840" stroke-width="3" />

  <text x="160" y="670" fill="#8b8ba0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="24">RECOMMENDED PICK</text>
  <text x="160" y="730" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="36">OVER 2.5 GOALS @ 1.85</text>

  <rect x="640" y="640" width="200" height="100" rx="16" fill="#00FF8820" stroke="#00FF88" stroke-width="2" />
  <text x="740" y="682" text-anchor="middle" fill="#8b8ba0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="18">CONFIDENCE</text>
  <text x="740" y="722" text-anchor="middle" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="32">88%</text>

  <!-- Footer Branding -->
  <text x="500" y="870" text-anchor="middle" fill="#e2e2e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="36" letter-spacing="6">TOTALSPORTBET.COM</text>
  <text x="500" y="910" text-anchor="middle" fill="#4a4a5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="20" letter-spacing="4">AUTOMATED AI SPORTS ANALYTICS</text>
</svg>
