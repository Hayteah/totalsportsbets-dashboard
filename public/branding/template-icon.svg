<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1000" height="1000" rx="40" fill="#0f0f18" />
  <!-- Subtle watermark lightning bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" opacity="0.2" />
  <!-- Sports Prediction Card Overlay Graphic -->
  <rect x="150" y="200" width="700" height="600" rx="24" fill="#12121e" stroke="#1a1a2e" stroke-width="6" />
  <!-- Card Header -->
  <rect x="190" y="240" width="620" height="80" rx="12" fill="#1a1a2e" />
  <circle cx="240" cy="280" r="20" fill="url(#boltGradient)" />
  <rect x="280" y="265" width="220" height="15" rx="4" fill="#e2e2e8" />
  <rect x="280" y="288" width="140" height="10" rx="3" fill="#8b8ba0" />
  <!-- Odds and Confidence Badge -->
  <rect x="620" y="260" width="160" height="40" rx="20" fill="#00FF8818" stroke="#00FF8840" stroke-width="2" />
  <text x="700" y="286" text-anchor="middle" fill="#00FF88" font-family="-apple-system, sans-serif" font-weight="800" font-size="22">88% HIGH</text>
  <!-- Match Pick Graphics -->
  <rect x="190" y="350" width="620" height="120" rx="16" fill="#08080d" stroke="#00FF8830" stroke-width="3" />
  <text x="230" y="420" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="32">REAL MADRID vs BARCELONA</text>
  <rect x="190" y="500" width="620" height="100" rx="16" fill="#00FF8815" stroke="#00FF88" stroke-width="3" />
  <text x="230" y="560" fill="#00FF88" font-family="-apple-system, sans-serif" font-weight="800" font-size="34">PICK: HOME WIN @ 2.10</text>
  <!-- Card Footer AI Badge -->
  <rect x="190" y="640" width="620" height="120" rx="16" fill="#1a1a2e" />
  <text x="500" y="710" text-anchor="middle" fill="#8b8ba0" font-family="-apple-system, sans-serif" font-weight="700" font-size="28">⚡ TOTALSPORTBET AI MATCH TEMPLATE</text>
</svg>
