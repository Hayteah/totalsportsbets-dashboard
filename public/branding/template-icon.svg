<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with slight neon border accent -->
  <rect width="1000" height="1000" rx="160" fill="#0c0c14" />
  <rect width="980" height="980" x="10" y="10" rx="150" fill="none" stroke="url(#boltGradient)" stroke-opacity="0.3" stroke-width="8" />

  <!-- Diagonal sports speed lines -->
  <line x1="100" y1="900" x2="300" y2="700" stroke="#00FF88" stroke-opacity="0.15" stroke-width="8" stroke-linecap="round" />
  <line x1="150" y1="950" x2="400" y2="700" stroke="#00AAFF" stroke-opacity="0.15" stroke-width="12" stroke-linecap="round" />
  <line x1="700" y1="300" x2="900" y2="100" stroke="#00FF88" stroke-opacity="0.15" stroke-width="10" stroke-linecap="round" />

  <!-- Central Lightning Bolt Mark -->
  <path d="M 580 180 L 340 520 L 520 520 L 400 820 L 660 460 L 480 460 Z" fill="url(#boltGradient)" filter="url(#glow)" />
</svg>
