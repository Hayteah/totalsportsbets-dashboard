<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#00AAFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" />
  <circle cx="500" cy="500" r="450" fill="url(#bgGlow)" />

  <!-- Outer Ring with Gradient Border -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#boltGrad)" stroke-width="12" opacity="0.8" />
  <circle cx="500" cy="500" r="410" fill="none" stroke="#1a1a2e" stroke-width="6" />

  <!-- Centered Lightning Bolt Emblem -->
  <g transform="translate(500, 500) scale(0.85) translate(-500, -500)">
    <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  </g>

  <!-- Decorative Accent Ring -->
  <circle cx="500" cy="500" r="465" fill="none" stroke="#00FF88" stroke-width="2" stroke-dasharray="12 12" opacity="0.4" />
</svg>
