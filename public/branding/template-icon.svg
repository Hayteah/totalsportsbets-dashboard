<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#08080d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Card Background Frame -->
  <rect width="800" height="1000" rx="32" fill="url(#cardBg)" />
  <rect x="12" y="12" width="776" height="976" rx="24" stroke="url(#boltGradient)" stroke-opacity="0.3" stroke-width="4" />

  <!-- Header Branding Banner -->
  <rect x="40" y="40" width="720" height="80" rx="16" fill="#12121e" stroke="url(#boltGradient)" stroke-opacity="0.2" />
  <text x="80" y="90" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" letter-spacing="2">TOTALSPORTBET</text>
  <text x="680" y="90" fill="#00AAFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" text-anchor="end">AI PREDICTION</text>

  <!-- Central Watermark Lightning Bolt -->
  <g opacity="0.2">
    <path d="M 480 300 L 280 580 L 420 580 L 320 820 L 520 540 L 380 540 Z" fill="url(#boltGradient)" filter="url(#glow)" />
  </g>

  <!-- Match Box Preview Frame -->
  <rect x="80" y="180" width="640" height="240" rx="20" fill="#12121e" stroke="#1a1a2e" stroke-width="2" />
  <text x="120" y="240" fill="#6b6b80" font-family="sans-serif" font-weight="700" font-size="18">CHAMPIONS LEAGUE</text>
  <text x="120" y="295" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="28">BAYER LEVERKUSEN vs ARSENAL</text>

  <!-- Odds Badge Placeholder -->
  <rect x="120" y="325" width="220" height="50" rx="10" fill="#00FF8818" stroke="#00FF8860" stroke-width="1.5" />
  <text x="230" y="358" fill="#00FF88" font-family="sans-serif" font-weight="800" font-size="20" text-anchor="middle">PICK: AWAY WIN @ 2.25</text>

  <!-- Confidence & Stats Strip -->
  <rect x="80" y="450" width="640" height="80" rx="16" fill="#0c0c14" stroke="#1a1a2e" />
  <text x="120" y="498" fill="#00AAFF" font-family="sans-serif" font-weight="800" font-size="20">AI CONFIDENCE: 72%</text>
  <text x="680" y="498" fill="#00FF88" font-family="sans-serif" font-weight="800" font-size="20" text-anchor="end">VALUE: +8.3%</text>

  <!-- Footer Branding -->
  <text x="400" y="920" fill="#4a4a5e" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">GENERATED BY TOTALSPORTBET AI ENGINE</text>
</svg>
