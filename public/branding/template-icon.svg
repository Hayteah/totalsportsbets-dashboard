<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#12121e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#08080d" rx="120" />
  <rect x="10" y="10" width="980" height="980" rx="110" fill="none" stroke="#1a1a2e" stroke-width="8" />

  <!-- Header Banner -->
  <rect x="80" y="80" width="840" height="100" rx="20" fill="#0f0f18" stroke="#1a1a2e" stroke-width="4" />
  <circle cx="140" cy="130" r="28" fill="url(#boltGradient)" />
  <text x="190" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="2">TOTALSPORTBET MATCH PREDICTIONS</text>

  <!-- Template Card Preview -->
  <rect x="80" y="220" width="840" height="700" rx="28" fill="url(#cardGrad)" stroke="#1a1a2e" stroke-width="6" />

  <!-- Background Lightning Watermark inside template -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" opacity="0.08" />

  <!-- Teams Section -->
  <rect x="130" y="270" width="740" height="120" rx="16" fill="#181828" stroke="#2a2a3e" stroke-width="2" />
  <text x="170" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" fill="#ffffff">HOME TEAM vs AWAY TEAM</text>

  <!-- Picks Grid Placeholder -->
  <g transform="translate(130, 420)">
    <rect width="355" height="180" rx="16" fill="#12121e" stroke="#00FF88" stroke-width="3" stroke-dasharray="8 4" />
    <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#8b8ba0">MARKET: OVER 2.5</text>
    <text x="30" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#00FF88">ODDS: 1.85</text>
    <rect x="30" y="130" width="120" height="30" rx="6" fill="#00FF8820" />
    <text x="45" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00FF88">HIGH 88%</text>
  </g>

  <g transform="translate(515, 420)">
    <rect width="355" height="180" rx="16" fill="#12121e" stroke="#00AAFF" stroke-width="3" stroke-dasharray="8 4" />
    <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#8b8ba0">MARKET: BOTH SCORE</text>
    <text x="30" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#00AAFF">ODDS: 1.75</text>
    <rect x="30" y="130" width="120" height="30" rx="6" fill="#00AAFF20" />
    <text x="45" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00AAFF">MED 72%</text>
  </g>

  <!-- AI Reasoning Box -->
  <rect x="130" y="630" width="740" height="180" rx="16" fill="#12121e" stroke="#1a1a2e" stroke-width="2" />
  <text x="170" y="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#FFAA00">🤖 AI ANALYTICS &amp; REASONING</text>
  <rect x="170" y="710" width="660" height="14" rx="7" fill="#2a2a3e" />
  <rect x="170" y="740" width="480" height="14" rx="7" fill="#2a2a3e" />
  <rect x="170" y="770" width="560" height="14" rx="7" fill="#2a2a3e" />

  <!-- Badge Seal -->
  <g filter="url(#glow)" transform="translate(720, 720)">
    <circle cx="80" cy="80" r="70" fill="url(#boltGradient)" />
    <path d="M 90 40 L 60 82 L 82 82 L 70 120 L 100 78 L 78 78 Z" fill="#08080d" />
  </g>
</svg>
