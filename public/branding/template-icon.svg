<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#08080d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Template Background Card Frame -->
  <rect width="800" height="1000" rx="40" fill="url(#cardBg)" stroke="#1a1a2e" stroke-width="8" />

  <!-- Top Header Banner Frame -->
  <rect x="40" y="40" width="720" height="140" rx="20" fill="#12121e" stroke="url(#boltGradient)" stroke-width="4" />

  <!-- Mini Header Logo Bolt -->
  <path d="M 100 70 L 70 115 L 90 115 L 75 150 L 115 105 L 95 105 Z" fill="url(#boltGradient)" />
  <text x="135" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="2">TOTALSPORTBET</text>
  <text x="135" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#00FF88" letter-spacing="4">DAILY MATCH PREDICTION</text>

  <!-- Match Card Template Slot 1 -->
  <rect x="40" y="220" width="720" height="180" rx="20" fill="#12121e" stroke="#1a1a2e" stroke-width="4" />
  <circle cx="100" cy="310" r="36" fill="#1a1a2e" />
  <circle cx="680" cy="310" r="36" fill="#1a1a2e" />
  <text x="400" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">HOME TEAM vs AWAY TEAM</text>
  <rect x="260" y="325" width="280" height="44" rx="10" fill="url(#boltGradient)" />
  <text x="400" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#0a0a0f" text-anchor="middle">PICK: OVER 2.5 @ 1.85</text>

  <!-- Center Watermark Lightning Bolt -->
  <path d="M 460 440 L 320 640 L 420 640 L 340 840 L 500 580 L 400 580 Z" fill="url(#boltGradient)" opacity="0.15" />

  <!-- Match Card Template Slot 2 -->
  <rect x="40" y="430" width="720" height="180" rx="20" fill="#12121e" stroke="#1a1a2e" stroke-width="4" />
  <text x="400" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">TEAM A vs TEAM B</text>
  <rect x="260" y="535" width="280" height="44" rx="10" fill="url(#boltGradient)" />
  <text x="400" y="564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#0a0a0f" text-anchor="middle">PICK: BTTS - YES @ 1.75</text>

  <!-- Footer Banner -->
  <rect x="40" y="860" width="720" height="90" rx="20" fill="#12121e" stroke="#1a1a2e" stroke-width="2" />
  <text x="400" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#8b8ba0" text-anchor="middle" letter-spacing="2">SWIPE FOR MORE PREDICTIONS · AI POWERED</text>
</svg>
