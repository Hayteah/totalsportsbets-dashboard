<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
  </defs>

  <!-- Transparent Watermark Background -->
  <rect width="1000" height="1000" fill="none"/>

  <!-- Subtle Template Grid & Target Guidelines -->
  <circle cx="500" cy="500" r="450" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="500" cy="500" r="350" fill="none" stroke="#00AAFF" stroke-width="2" opacity="0.15"/>
  <line x1="50" y1="500" x2="950" y2="500" stroke="#1a1a2e" stroke-width="2" opacity="0.2"/>
  <line x1="500" y1="50" x2="500" y2="950" stroke="#1a1a2e" stroke-width="2" opacity="0.2"/>

  <!-- Watermark Lightning Bolt with Opacity 0.2 -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" opacity="0.2"/>
</svg>
