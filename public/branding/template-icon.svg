<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#12121e"/>
    </linearGradient>
    <filter id="templateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#08080d"/>

  <!-- Subtle Cyber Watermark Icon in background -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#neonGrad)" opacity="0.05" transform="translate(100, 100) scale(1.1)"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1032" height="1032" rx="36" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.8"/>
  <rect x="40" y="40" width="1000" height="1000" rx="28" fill="url(#cardGrad)" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Header Bar -->
  <rect x="40" y="40" width="1000" height="120" rx="28" fill="#0c0c14" stroke="#1a1a2e" stroke-width="2"/>

  <!-- Logo Icon Badge -->
  <rect x="70" y="65" width="70" height="70" rx="20" fill="#12121e" stroke="url(#neonGrad)" stroke-width="3"/>
  <path d="M 112 80 L 92 105 L 104 105 L 98 122 L 118 97 L 106 97 Z" fill="url(#neonGrad)"/>

  <text x="160" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="2">TOTALSPORTBET <tspan fill="#00FF88">AI</tspan></text>
  <text x="160" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#00AAFF" letter-spacing="3">AI PREDICTION GRAPHIC TEMPLATE</text>

  <!-- League Badge Right -->
  <rect x="760" y="75" width="240" height="50" rx="25" fill="#12121e" stroke="#00FF88" stroke-width="2"/>
  <text x="880" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00FF88" letter-spacing="1" text-anchor="middle">CHAMPIONS LEAGUE</text>

  <!-- Match Card Container -->
  <rect x="70" y="200" width="940" height="230" rx="24" fill="#08080d" stroke="#1a1a2e" stroke-width="3"/>

  <!-- Match Info -->
  <text x="540" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#8b8ba0" text-anchor="middle" letter-spacing="3">TODAY • 21:00 CET</text>

  <!-- Home vs Away -->
  <text x="250" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">REAL MADRID</text>
  <circle cx="540" cy="310" r="32" fill="#12121e" stroke="url(#neonGrad)" stroke-width="3"/>
  <text x="540" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#00FF88" text-anchor="middle">VS</text>
  <text x="830" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">MAN CITY</text>

  <!-- Prediction Box Header -->
  <text x="70" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#8b8ba0" letter-spacing="2">OFFICIAL AI SELECTION</text>

  <!-- Main Prediction Highlight Card -->
  <rect x="70" y="510" width="940" height="340" rx="24" fill="#0c0c14" stroke="url(#neonGrad)" stroke-width="4" filter="url(#templateGlow)"/>

  <!-- Pick Title -->
  <text x="120" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#00AAFF" letter-spacing="2">MARKET: BOTH TEAMS TO SCORE (BTTS)</text>
  <text x="120" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff">PICK: YES</text>
  <text x="120" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" fill="#00FF88">ODDS @ 1.80</text>

  <!-- Badges inside Prediction Card -->
  <!-- Confidence Badge -->
  <rect x="680" y="560" width="280" height="60" rx="30" fill="#00FF8818" stroke="#00FF88" stroke-width="2"/>
  <text x="820" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#00FF88" text-anchor="middle">CONFIDENCE: 80%</text>

  <!-- Stake & Value Badges -->
  <rect x="680" y="640" width="280" height="50" rx="25" fill="#12121e" stroke="#1a1a2e" stroke-width="2"/>
  <text x="820" y="672" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">STAKE: 3.0 UNITS</text>

  <rect x="680" y="710" width="280" height="50" rx="25" fill="#00FF8815" stroke="#00FF88" stroke-width="2"/>
  <text x="820" y="742" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#00FF88" text-anchor="middle">EXPECTED VALUE: +14.2%</text>

  <!-- Footer Info Bar -->
  <rect x="70" y="890" width="940" height="110" rx="22" fill="#08080d" stroke="#1a1a2e" stroke-width="2"/>
  <text x="110" y="952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#8b8ba0">FOLLOW FOR DAILY PICKS: <tspan fill="#00FF88">@totalsportbet_ai</tspan></text>
  <text x="970" y="952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#00AAFF" text-anchor="end">VERIFIED BY AI ALGORITHM ✓</text>
</svg>
