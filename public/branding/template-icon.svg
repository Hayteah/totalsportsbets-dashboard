<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F18" />
      <stop offset="100%" stop-color="#12121E" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Card Outline & Background -->
  <rect x="20" y="20" width="760" height="960" rx="32" fill="url(#cardGrad)" stroke="#00FF8840" stroke-width="4" />

  <!-- Subtle Lightning Bolt Background Watermark -->
  <path d="M 480 150 L 260 470 L 420 470 L 320 750 L 540 430 L 380 430 Z" fill="url(#boltGrad)" opacity="0.12" />

  <!-- Top Header Section -->
  <rect x="50" y="50" width="700" height="120" rx="20" fill="#1A1A2E80" stroke="#00FF8830" stroke-width="2" />
  <circle cx="110" cy="110" r="36" fill="#00FF8820" stroke="#00FF88" stroke-width="3" />
  <path d="M 118 85 L 98 112 L 112 112 L 102 135 L 122 108 L 108 108 Z" fill="#00FF88" />
  <text x="170" y="102" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="1">TOTALSPORTBET AI</text>
  <text x="170" y="130" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="2">HIGH CONFIDENCE PICK</text>

  <!-- Match Title Container -->
  <rect x="50" y="200" width="700" height="160" rx="20" fill="#08080D90" stroke="#1A1A2E" stroke-width="2" />
  <text x="400" y="260" fill="#8B8BA0" font-family="system-ui, sans-serif" font-weight="700" font-size="20" text-anchor="middle">CHAMPIONS LEAGUE · 21:00 CET</text>
  <text x="400" y="315" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="34" text-anchor="middle">REAL MADRID vs MAN CITY</text>

  <!-- Prediction Box -->
  <rect x="50" y="390" width="700" height="380" rx="24" fill="#0F0F18" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" />
  <text x="400" y="460" fill="#8B8BA0" font-family="system-ui, sans-serif" font-weight="700" font-size="22" text-anchor="middle">RECOMMENDED MARKET PICK</text>
  <text x="400" y="540" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="900" font-size="48" text-anchor="middle">Real Madrid Win & Over 2.5</text>

  <g transform="translate(150, 600)">
    <rect x="0" y="0" width="220" height="110" rx="16" fill="#12121E" stroke="#00FF8830" stroke-width="2" />
    <text x="110" y="40" fill="#8B8BA0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">ODDS</text>
    <text x="110" y="85" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="900" font-size="36" text-anchor="middle">@ 2.15</text>
  </g>

  <g transform="translate(430, 600)">
    <rect x="0" y="0" width="220" height="110" rx="16" fill="#12121E" stroke="#00AAFF30" stroke-width="2" />
    <text x="110" y="40" fill="#8B8BA0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">CONFIDENCE</text>
    <text x="110" y="85" fill="#00AAFF" font-family="system-ui, sans-serif" font-weight="900" font-size="36" text-anchor="middle">88%</text>
  </g>

  <!-- Bottom CTA / Watermark Banner -->
  <rect x="50" y="800" width="700" height="120" rx="20" fill="url(#accentGrad)" opacity="0.15" />
  <text x="400" y="850" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="22" text-anchor="middle">AUTOMATED PREDICTION BY TOTALSPORTBET AI</text>
  <text x="400" y="885" fill="#00FF88" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">FOLLOW FOR DAILY HIGH-VALUE PICKS</text>
</svg>
