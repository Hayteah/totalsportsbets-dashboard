<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Template Overlay Structure -->
  <rect width="800" height="1000" rx="32" fill="#08080d" />
  <rect width="784" height="984" x="8" y="8" rx="28" fill="none" stroke="url(#boltGradient)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Grid/Line Graphic Motifs -->
  <path d="M 0 200 L 800 200 M 0 800 L 800 800" stroke="#1a1a2e" stroke-width="2" />
  <circle cx="400" cy="500" r="300" fill="none" stroke="#1a1a2e" stroke-dasharray="12 12" stroke-width="2" />

  <!-- Watermark Glowing Bolt -->
  <path d="M 460 250 L 280 520 L 410 520 L 320 750 L 520 480 L 390 480 Z" fill="url(#boltGradient)" opacity="0.15" filter="url(#glow)" />
  <path d="M 460 250 L 280 520 L 410 520 L 320 750 L 520 480 L 390 480 Z" fill="url(#boltGradient)" opacity="0.8" />

  <!-- Badge / Emblem Header Frame -->
  <rect x="250" y="80" width="300" height="60" rx="30" fill="#0c0c14" stroke="url(#boltGradient)" stroke-width="3" />
  <text x="400" y="118" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="3" text-anchor="middle">TOTALSPORTBET</text>
</svg>
