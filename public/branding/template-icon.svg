<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <pattern id="gridPattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1a1a2e" stroke-width="2" />
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="#0f0f18" />
  <rect width="1000" height="1000" fill="url(#gridPattern)" opacity="0.5" />

  <!-- Sport Field Lines overlay -->
  <circle cx="500" cy="500" r="250" fill="none" stroke="#00FF8815" stroke-width="4" />
  <line x1="100" y1="500" x2="900" y2="500" stroke="#00FF8815" stroke-width="4" />

  <!-- Centered watermark lightning bolt -->
  <path d="M 580 200 L 360 520 L 520 520 L 420 800 L 640 480 L 480 480 Z" fill="url(#boltGradient)" opacity="0.2" />

  <text x="500" y="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" fill="#00FF88" opacity="0.4" text-anchor="middle" letter-spacing="6">TOTALSPORTBET TEMPLATE</text>
  <text x="500" y="910" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#8b8ba0" opacity="0.4" text-anchor="middle" letter-spacing="4">AI PREDICTION GRAPHIC</text>
</svg>
