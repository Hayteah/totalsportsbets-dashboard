<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c14" />
      <stop offset="50%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#12121e" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame Background -->
  <rect width="800" height="1000" rx="32" fill="url(#cardGrad)" stroke="#1a1a2e" stroke-width="4" />

  <!-- Outer Glow Border -->
  <rect x="16" y="16" width="768" height="968" rx="24" fill="none" stroke="url(#boltGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Background Watermark Bolt -->
  <g opacity="0.12">
    <path d="M 480 150 L 260 470 L 420 470 L 320 750 L 540 430 L 380 430 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Card Header -->
  <g transform="translate(40, 50)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="220" height="44" rx="22" fill="#00FF8820" stroke="#00FF8850" stroke-width="1" />
    <text x="110" y="27" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#00FF88" letter-spacing="2" text-anchor="middle">🔥 VIP PICK</text>

    <!-- Logo / Brand Right -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="220" height="44" rx="10" fill="#12121e" stroke="#1a1a2e" stroke-width="1" />
      <path d="M 22 10 L 12 24 L 18 24 L 14 34 L 26 20 L 20 20 Z" fill="url(#boltGrad)" />
      <text x="125" y="27" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">TOTALSPORTBET</text>
    </g>
  </g>

  <!-- Main Match Header -->
  <g transform="translate(40, 160)">
    <text x="360" y="30" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#00AAFF" letter-spacing="3" text-anchor="middle">CHAMPIONS LEAGUE · 21:00 CET</text>

    <!-- Teams Display -->
    <text x="360" y="90" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">REAL MADRID <tspan fill="#00FF88">VS</tspan> MAN CITY</text>
  </g>

  <!-- Prediction Box -->
  <g transform="translate(60, 310)">
    <rect x="0" y="0" width="680" height="240" rx="20" fill="#08080d" stroke="url(#boltGrad)" stroke-width="3" filter="url(#neonGlow)" />

    <!-- Market Label -->
    <text x="340" y="50" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#6b6b80" letter-spacing="3" text-anchor="middle">MAIN PREDICTION</text>

    <!-- Pick -->
    <text x="340" y="115" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">BOTH TEAMS TO SCORE</text>

    <!-- Odds & Confidence Bar -->
    <g transform="translate(40, 150)">
      <!-- Odds Pill -->
      <rect x="60" y="0" width="180" height="54" rx="14" fill="#00FF8820" stroke="#00FF88" stroke-width="2" />
      <text x="150" y="36" font-family="-apple-system, monospace" font-size="28" font-weight="900" fill="#00FF88" text-anchor="middle">@1.85</text>

      <!-- Value Pill -->
      <rect x="340" y="0" width="200" height="54" rx="14" fill="#FFD70020" stroke="url(#goldGrad)" stroke-width="2" />
      <text x="440" y="36" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFD700" text-anchor="middle">CONF. 85%</text>
    </g>
  </g>

  <!-- Stats Grid -->
  <g transform="translate(60, 600)">
    <!-- AI Confidence -->
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#0a0a0f" stroke="#1a1a2e" stroke-width="2" />
    <text x="160" y="40" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#6b6b80" text-anchor="middle">AI VALUE RATING</text>
    <text x="160" y="85" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#00FF88" text-anchor="middle">+14.2%</text>

    <!-- Recommended Stake -->
    <rect x="360" y="0" width="320" height="130" rx="16" fill="#0a0a0f" stroke="#1a1a2e" stroke-width="2" />
    <text x="520" y="40" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#6b6b80" text-anchor="middle">RECOMMENDED STAKE</text>
    <text x="520" y="85" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#00AAFF" text-anchor="middle">3.0 UNITS</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 880)">
    <rect x="0" y="0" width="680" height="60" rx="16" fill="#12121e" stroke="#1a1a2e" stroke-width="1" />
    <text x="340" y="36" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#8b8ba0" letter-spacing="2" text-anchor="middle">⚡ POWERED BY TOTALSPORTBET AI ENGINE</text>
  </g>
</svg>
