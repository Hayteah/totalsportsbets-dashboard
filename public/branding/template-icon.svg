<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="tplGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>
  </defs>

  <!-- Card Frame Template Icon -->
  <rect x="100" y="100" width="800" height="800" rx="120" fill="#0f0f18" stroke="url(#tplGradient)" stroke-width="16" />

  <!-- Subtle Background Lightning Watermark -->
  <path d="M 580 220 L 380 500 L 520 500 L 420 780 L 620 460 L 480 460 Z" fill="url(#tplGradient)" opacity="0.2" />

  <!-- Center Card Graphic Line Elements -->
  <rect x="250" y="320" width="500" height="40" rx="20" fill="url(#tplGradient)" />
  <rect x="250" y="400" width="340" height="28" rx="14" fill="#2a2a3e" />
  <rect x="250" y="460" width="420" height="28" rx="14" fill="#2a2a3e" />

  <!-- Stats Badge Graphic -->
  <rect x="250" y="540" width="220" height="120" rx="24" fill="#00FF8820" stroke="#00FF88" stroke-width="6" />
  <text x="360" y="615" fill="#00FF88" font-family="monospace, sans-serif" font-size="44" font-weight="900" text-anchor="middle">98.4%</text>

  <rect x="510" y="540" width="240" height="120" rx="24" fill="#00AAFF20" stroke="#00AAFF" stroke-width="6" />
  <text x="630" y="615" fill="#00AAFF" font-family="monospace, sans-serif" font-size="44" font-weight="900" text-anchor="middle">@2.85</text>
</svg>
